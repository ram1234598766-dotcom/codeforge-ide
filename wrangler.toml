name = "codeforge-ide"
compatibility_date = "2026-10-30"
main = "apps/web/functions/index.ts" # Entry point for Worker Functions
workers_dev = true # Enables codeforge-ide.vasudevaya.workers.dev

# Cloudflare Pages Output Directory (for static assets)
pages_build_output_dir = "apps/web/dist"

# Environment Variables for Build
[vars]
VITE_SUPABASE_URL = "https://rbgnjcquiqszkeiumueo.supabase.co"
VITE_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_a32yW-Ajq9KHgCDQoUBogg_yGOv3wXk"

# D1 Database Binding (Replace <D1_DATABASE_ID> with your actual D1 ID)
[[d1_databases]]
binding = "CODEFORGE_DB"
database_id = "<D1_DATABASE_ID>" # e.g., "12345678-1234-1234-1234-1234567890ab"
database_name = "codeforge_d1"

# KV Namespace Binding (Replace <KV_NAMESPACE_ID> with your actual KV ID)
[[kv_namespaces]]
binding = "CODEFORGE_KV"
id = "<KV_NAMESPACE_ID>" # e.g., "abcdef1234567890abcdef1234567890"

# Build configuration for Worker Functions
[build]
command = "npm --prefix apps/web install --no-audit --no-fund && npm --prefix apps/web run build"
cwd = "apps/web"

# Note: For Cloudflare Pages (static site), the build command in GitHub Actions/Pages
# will still use `npm run build` and deploy `apps/web/dist`.
# For Worker deployment (codeforge-ide.vasudevaya.workers.dev), `npx wrangler deploy`
# will use the `main` entry point and bindings defined above.
