name: CodeForge Worker CI

concurrency:
  group: codeforge-worker-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main
      - feat/cloudflare-worker-foundation

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        run: npm --prefix apps/web install --include=optional --no-audit --no-fund
      - name: Dependency security audit
        run: npm --prefix apps/web audit --audit-level=high
      - name: Unit and regression tests
        run: npm --prefix apps/web test
      - name: Type-check
        run: npm --prefix apps/web run typecheck
      - name: Production build
        run: npm --prefix apps/web run build
      - name: Validate Worker configuration and bundle
        run: npx --yes wrangler@4 deploy --dry-run
