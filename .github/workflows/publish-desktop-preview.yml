name: Publish CodeForge signed Windows desktop preview

on:
  workflow_run:
    workflows: ["CodeForge production installers"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

concurrency:
  group: codeforge-desktop-preview-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish self-signed Windows preview
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify source installer workflow run
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [[ -z "$UPSTREAM_RUN_ID" || -z "$SOURCE_SHA" ]]; then
            echo "::error::No successful production-installer run exists for the exact source SHA."
            exit 1
          fi
          RUN_JSON="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$UPSTREAM_RUN_ID")"
          jq -e \
            --arg sha "$SOURCE_SHA" \
            '.path == ".github/workflows/production-installers.yml" and
             .status == "completed" and
             .head_branch == "main" and
             .head_sha == $sha' <<< "$RUN_JSON" >/dev/null
          RUN_NUMBER="$(jq -r '.run_number' <<< "$RUN_JSON")"
          JOBS_JSON="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$UPSTREAM_RUN_ID/jobs?per_page=100")"
          WINDOWS_JOB_CONCLUSION="$(jq -r '.jobs[] | select(.name == "Build Windows desktop installer") | .conclusion' <<< "$JOBS_JSON")"
          if [[ "$WINDOWS_JOB_CONCLUSION" != "success" ]]; then
            echo "::error::The Windows installer job did not complete successfully; no preview can be published."
            exit 1
          fi
          test "$RUN_NUMBER" -gt 0
          {
            echo "source_sha=$SOURCE_SHA"
            echo "upstream_run_id=$UPSTREAM_RUN_ID"
            echo "run_number=$RUN_NUMBER"
            echo "windows_job_conclusion=$WINDOWS_JOB_CONCLUSION"
            echo "version=1.0.$RUN_NUMBER"
            echo "tag=v1.0.$RUN_NUMBER-desktop-preview-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: codeforge-windows-installer
          path: release/windows
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.upstream_run_id }}

      - name: Verify Windows preview artifact and checksum
        id: verify
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          UPSTREAM_RUN_ID: ${{ steps.source.outputs.upstream_run_id }}
          RUN_NUMBER: ${{ steps.source.outputs.run_number }}
          TAG: ${{ steps.source.outputs.tag }}
        run: |
          set -euo pipefail
          SIGNING_STATE="$(sed -n 's/^SIGNING=//p' release/windows/WINDOWS-SIGNING-METADATA.txt | head -n 1)"
          if [[ "$SIGNING_STATE" == "durable" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "A trusted SignPath-signed Windows installer is reserved for the full versioned release pipeline."
            exit 0
          fi
          if [[ "$SIGNING_STATE" != "self-signed" ]]; then
            echo "::error::Only a verified self-signed Windows preview or a durable full release is accepted."
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          test -s release/windows/CodeForge-Setup-Windows.exe
          test -s release/windows/SHA256-Windows.txt
          test -s release/windows/BUILD-METADATA.txt
          test -s release/windows/WINDOWS-SIGNING-METADATA.txt
          test -s release/windows/CodeForge-Windows-Certificate.cer
          grep -Fx "COMMIT=$SOURCE_SHA" release/windows/BUILD-METADATA.txt
          grep -Fx "WORKFLOW_RUN_ID=$UPSTREAM_RUN_ID" release/windows/BUILD-METADATA.txt
          grep -Fx "RUN_NUMBER=$RUN_NUMBER" release/windows/BUILD-METADATA.txt
          grep -Fx "VERSION=1.0.$RUN_NUMBER" release/windows/BUILD-METADATA.txt
          grep -Fx "SIGNING=self-signed" release/windows/BUILD-METADATA.txt
          grep -Fx "SIGNING=self-signed" release/windows/WINDOWS-SIGNING-METADATA.txt
          grep -Fx "SIGNATURE_STATUS=Valid" release/windows/WINDOWS-SIGNING-METADATA.txt
          grep -Fx "TRUST=not-publicly-trusted" release/windows/WINDOWS-SIGNING-METADATA.txt
          (cd release/windows && sha256sum -c SHA256-Windows.txt)
          sudo apt-get update
          sudo apt-get install -y osslsigncode
          openssl x509 -inform DER -in release/windows/CodeForge-Windows-Certificate.cer -out release/windows/CodeForge-Windows-Certificate.pem
          CERT_THUMBPRINT="$(openssl x509 -in release/windows/CodeForge-Windows-Certificate.pem -noout -fingerprint -sha1 | sed -E 's/^.*=//; s/://g' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_THUMBPRINT="$(sed -n 's/^THUMBPRINT=//p' release/windows/WINDOWS-SIGNING-METADATA.txt | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
          CERT_EXPECTED="$(sed -n 's/^CERT_FILE_SHA256=//p' release/windows/WINDOWS-SIGNING-METADATA.txt | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          CERT_ACTUAL="$(sha256sum release/windows/CodeForge-Windows-Certificate.cer | awk '{print $1}')"
          test -n "$CERT_EXPECTED"
          test "$CERT_ACTUAL" = "$CERT_EXPECTED"
          test -n "$CERT_THUMBPRINT"
          test "$CERT_THUMBPRINT" = "$EXPECTED_THUMBPRINT"
          osslsigncode verify -CAfile release/windows/CodeForge-Windows-Certificate.pem -in release/windows/CodeForge-Setup-Windows.exe
          echo "SELF-SIGNED PREVIEW — NOT PUBLICLY TRUSTED" > release/windows/SELF-SIGNED-PREVIEW-WARNING.txt
          {
            printf '# CodeForge %s — Windows desktop preview\n\n' "$TAG"
            printf '> **SELF-SIGNED PREVIEW:** The installer has a verified Authenticode signature from a CodeForge self-signed certificate. This certificate is not publicly trusted. Windows SmartScreen or Defender may still display warnings. The certificate is generated for this preview build and may change in a later release.\n\n'
            printf '## Installer\n- File: CodeForge-Setup-Windows.exe\n- Version: %s\n- SHA-256: %s\n- Signing: **Self-signed Authenticode — not publicly trusted**\n- Public certificate: CodeForge-Windows-Certificate.cer\n\n' \
              "1.0.$RUN_NUMBER" "$(awk '{print $1}' release/windows/SHA256-Windows.txt)"
            printf '## Provenance\n- Source commit: %s\n- Production installer workflow run: %s\n\n' \
              "$SOURCE_SHA" "$UPSTREAM_RUN_ID"
            printf '## Trust and verification\nThe public certificate is included so its fingerprint can be checked independently. Do not trust or install it unless you have verified the certificate and installer hashes from a trusted source. Importing it locally can establish trust only for this certificate; it does not create a publicly trusted publisher identity or guarantee SmartScreen reputation.\n'
          } > release/windows/RELEASE-NOTES.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release tag $TAG already exists; refusing to overwrite an existing release."
            exit 1
          fi

      - name: Publish Windows desktop preview release
        if: steps.verify.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.source.outputs.tag }}
          target_commitish: ${{ steps.source.outputs.source_sha }}
          name: CodeForge ${{ steps.source.outputs.version }} — Windows Desktop Preview (Self-Signed)
          draft: false
          prerelease: true
          make_latest: false
          body_path: release/windows/RELEASE-NOTES.md
          fail_on_unmatched_files: true
          files: |
            release/windows/CodeForge-Setup-Windows.exe
            release/windows/SHA256-Windows.txt
            release/windows/BUILD-METADATA.txt
            release/windows/WINDOWS-SIGNING-METADATA.txt
            release/windows/SELF-SIGNED-PREVIEW-WARNING.txt
            release/windows/CodeForge-Windows-Certificate.cer

      - name: Verify public preview release and download
        if: steps.verify.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.source.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json isDraft,isPrerelease,assets > release/windows/published-release.json
          jq -e '.isDraft == false and .isPrerelease == true and
            any(.assets[]; .name == "CodeForge-Setup-Windows.exe" and .size > 0) and
            any(.assets[]; .name == "SHA256-Windows.txt" and .size > 0) and
            any(.assets[]; .name == "CodeForge-Windows-Certificate.cer" and .size > 0)' \
            release/windows/published-release.json >/dev/null
          mkdir -p release/windows/download-check
          gh release download "$TAG" --pattern CodeForge-Setup-Windows.exe --dir release/windows/download-check
          cmp release/windows/CodeForge-Setup-Windows.exe release/windows/download-check/CodeForge-Setup-Windows.exe
          cmp release/windows/CodeForge-Windows-Certificate.cer release/windows/download-check/CodeForge-Windows-Certificate.cer
          EXPECTED="$(awk '{print $1}' release/windows/SHA256-Windows.txt)"
          ACTUAL="$(sha256sum release/windows/download-check/CodeForge-Setup-Windows.exe | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          echo "Published and re-downloaded self-signed Windows preview $TAG; checksum and certificate fingerprint match." >> "$GITHUB_STEP_SUMMARY"
