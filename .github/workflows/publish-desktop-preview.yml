name: Publish CodeForge Windows desktop preview

on:
  workflow_run:
    workflows: ["CodeForge production installers"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

concurrency:
  group: codeforge-desktop-preview-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish explicitly unsigned Windows preview
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify source installer workflow run
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [[ -z "$UPSTREAM_RUN_ID" || -z "$SOURCE_SHA" ]]; then
            echo "::error::No successful production-installer run exists for the exact source SHA."
            exit 1
          fi
          RUN_JSON="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$UPSTREAM_RUN_ID")"
          jq -e \
            --arg sha "$SOURCE_SHA" \
            '.path == ".github/workflows/production-installers.yml" and
             .status == "completed" and
             .conclusion == "success" and
             .head_branch == "main" and
             .head_sha == $sha' <<< "$RUN_JSON" >/dev/null
          RUN_NUMBER="$(jq -r '.run_number' <<< "$RUN_JSON")"
          test "$RUN_NUMBER" -gt 0
          {
            echo "source_sha=$SOURCE_SHA"
            echo "upstream_run_id=$UPSTREAM_RUN_ID"
            echo "run_number=$RUN_NUMBER"
            echo "version=1.0.$RUN_NUMBER"
            echo "tag=v1.0.$RUN_NUMBER-desktop-preview"
          } >> "$GITHUB_OUTPUT"

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: codeforge-windows-installer
          path: release/windows
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.upstream_run_id }}

      - name: Verify Windows preview artifact and checksum
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          UPSTREAM_RUN_ID: ${{ steps.source.outputs.upstream_run_id }}
          RUN_NUMBER: ${{ steps.source.outputs.run_number }}
          TAG: ${{ steps.source.outputs.tag }}
        run: |
          set -euo pipefail
          test -s release/windows/CodeForge-Setup-Windows.exe
          test -s release/windows/SHA256-Windows.txt
          test -s release/windows/BUILD-METADATA.txt
          test -s release/windows/WINDOWS-SIGNING-METADATA.txt
          grep -Fx "COMMIT=$SOURCE_SHA" release/windows/BUILD-METADATA.txt
          grep -Fx "WORKFLOW_RUN_ID=$UPSTREAM_RUN_ID" release/windows/BUILD-METADATA.txt
          grep -Fx "RUN_NUMBER=$RUN_NUMBER" release/windows/BUILD-METADATA.txt
          grep -Fx "VERSION=1.0.$RUN_NUMBER" release/windows/BUILD-METADATA.txt
          grep -Fx "SIGNING=unsigned" release/windows/BUILD-METADATA.txt
          grep -Fx "SIGNING=unsigned" release/windows/WINDOWS-SIGNING-METADATA.txt
          grep -Fx "SIGNATURE_STATUS=not-signed" release/windows/WINDOWS-SIGNING-METADATA.txt
          (cd release/windows && sha256sum -c SHA256-Windows.txt)
          echo "UNSIGNED PREVIEW — NOT AUTHENTICODE SIGNED" > release/windows/UNSIGNED-PREVIEW-WARNING.txt
          {
            printf '# CodeForge %s — Windows desktop preview\n\n' "$TAG"
            printf '> **UNSIGNED PREVIEW:** This Windows installer is not Authenticode signed. Windows SmartScreen or Defender may display publisher and reputation warnings. It is provided for testing only and is not a trusted production installer.\n\n'
            printf '## Installer\n- File: CodeForge-Setup-Windows.exe\n- Version: %s\n- SHA-256: %s\n- Signing: **Unsigned — no Authenticode signature**\n\n' \
              "1.0.$RUN_NUMBER" "$(awk '{print $1}' release/windows/SHA256-Windows.txt)"
            printf '## Provenance\n- Source commit: %s\n- Production installer workflow run: %s\n\n' \
              "$SOURCE_SHA" "$UPSTREAM_RUN_ID"
            printf '## Production signing\nA separately labelled production release will be published only after SignPath signing and Authenticode verification succeed. This preview does not replace that process.\n'
          } > release/windows/RELEASE-NOTES.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release tag $TAG already exists; refusing to overwrite an existing release."
            exit 1
          fi

      - name: Publish Windows desktop preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.source.outputs.tag }}
          target_commitish: ${{ steps.source.outputs.source_sha }}
          name: CodeForge ${{ steps.source.outputs.version }} — Windows Desktop Preview (Unsigned)
          draft: false
          prerelease: true
          make_latest: false
          body_path: release/windows/RELEASE-NOTES.md
          fail_on_unmatched_files: true
          files: |
            release/windows/CodeForge-Setup-Windows.exe
            release/windows/SHA256-Windows.txt
            release/windows/BUILD-METADATA.txt
            release/windows/WINDOWS-SIGNING-METADATA.txt
            release/windows/UNSIGNED-PREVIEW-WARNING.txt

      - name: Verify public preview release and download
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.source.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json isDraft,isPrerelease,assets > release/windows/published-release.json
          jq -e '.isDraft == false and .isPrerelease == true and
            any(.assets[]; .name == "CodeForge-Setup-Windows.exe" and .size > 0) and
            any(.assets[]; .name == "SHA256-Windows.txt" and .size > 0)' \
            release/windows/published-release.json >/dev/null
          mkdir -p release/windows/download-check
          gh release download "$TAG" --pattern CodeForge-Setup-Windows.exe --dir release/windows/download-check
          cmp release/windows/CodeForge-Setup-Windows.exe release/windows/download-check/CodeForge-Setup-Windows.exe
          EXPECTED="$(awk '{print $1}' release/windows/SHA256-Windows.txt)"
          ACTUAL="$(sha256sum release/windows/download-check/CodeForge-Setup-Windows.exe | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          echo "Published and re-downloaded unsigned Windows preview $TAG; checksum matches." >> "$GITHUB_STEP_SUMMARY"
