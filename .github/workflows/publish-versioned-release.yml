name: Publish verified CodeForge versioned release

on:
  workflow_run:
    workflows: ["CodeForge production installers"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Verify installers and publish unique version
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: codeforge-windows-installer
          path: release/windows
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download Android APK artifact
        uses: actions/download-artifact@v4
        with:
          name: codeforge-android-apk
          path: release/android
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Install Android verification tools
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools build-tools;36.0.0"

      - name: Verify required assets, signatures, and checksums
        shell: bash
        run: |
          set -euo pipefail
          test -s release/windows/CodeForge-Setup-Windows.exe
          test -s release/windows/CodeForge-SelfSigned.cer
          test -s release/windows/SHA256-Windows.txt
          test -s release/android/CodeForge.apk
          test -s release/android/SHA256-Android.txt
          test -s release/android/BUILD-METADATA.txt
          (cd release/windows && sed 's#  release/#  #' SHA256-Windows.txt | sha256sum -c -)
          (cd release/android && sed 's#  release/#  #' SHA256-Android.txt | sha256sum -c -)
          SDK_BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$SDK_BUILD_TOOLS/apksigner" verify --verbose --print-certs release/android/CodeForge.apk
          printf 'Commit: %s\nWorkflow run: %s\nVersion: 1.0.%s\n' "${{ github.event.workflow_run.head_sha }}" "${{ github.event.workflow_run.id }}" "${{ github.event.workflow_run.run_number }}" > release/BUILD-INFO.txt
          sha256sum release/windows/CodeForge-Setup-Windows.exe release/android/CodeForge.apk > release/SHA256SUMS.txt

      - name: Publish a new versioned GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.event.workflow_run.run_number }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: CodeForge v1.0.${{ github.event.workflow_run.run_number }}
          make_latest: true
          generate_release_notes: true
          body: |
            Verified Windows and Android installers for commit ${{ github.event.workflow_run.head_sha }}.

            Windows: signed with a per-build self-signed publisher certificate. Import the included certificate only if you trust this build.
            Android: the APK signature is verified. This build uses a per-build signing identity; a reinstall may be required for future versions.
          files: |
            release/windows/CodeForge-Setup-Windows.exe
            release/windows/CodeForge-SelfSigned.cer
            release/windows/SHA256-Windows.txt
            release/android/CodeForge.apk
            release/android/SHA256-Android.txt
            release/android/BUILD-METADATA.txt
            release/BUILD-INFO.txt
            release/SHA256SUMS.txt
