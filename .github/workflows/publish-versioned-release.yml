name: Publish verified CodeForge Android release

on:
  workflow_run:
    workflows: ["CodeForge production installers"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

concurrency:
  group: codeforge-android-release-publisher
  cancel-in-progress: false

jobs:
  publish:
    name: Verify Android signing and publish APK
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact source revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Download Android APK artifact
        uses: actions/download-artifact@v8
        with:
          name: codeforge-android-apk
          path: release/android
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Check Android durable signing eligibility
        id: eligibility
        shell: bash
        env:
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for file in CodeForge.apk SHA256-Android.txt ANDROID-SIGNING-METADATA.txt BUILD-METADATA.txt APK-METADATA.txt; do
            test -s "release/android/$file" || { echo "::error::Missing Android release file: $file"; exit 1; }
          done
          ANDROID_SIGNING="$(sed -n 's/^SIGNING=//p' release/android/ANDROID-SIGNING-METADATA.txt | head -n 1)"
          if [[ "$ANDROID_SIGNING" != "durable" ]]; then
            echo "release_ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Android release not published"
              echo
              echo "The APK was built, but the production signing workflow did not verify the durable Android release keystore."
              echo "The APK remains a private Actions artifact; no public release or download was created."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ -z "$ANDROID_SIGNING_CERT_SHA256" ]]; then
            echo "release_ready=false" >> "$GITHUB_OUTPUT"
            echo "ANDROID_SIGNING_CERT_SHA256 is not configured; no public APK release was created." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "release_ready=true" >> "$GITHUB_OUTPUT"

      - name: Install Android verification tools
        if: steps.eligibility.outputs.release_ready == 'true'
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools build-tools;36.0.0"

      - name: Verify APK checksum, signer, package, and build provenance
        if: steps.eligibility.outputs.release_ready == 'true'
        shell: bash
        env:
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          cd release/android
          sha256sum -c SHA256-Android.txt
          grep -Fx "PACKAGE=com.codeforge.ide" BUILD-METADATA.txt
          grep -Fx "SIGNING=durable" BUILD-METADATA.txt
          grep -Fx "COMMIT=$SOURCE_SHA" BUILD-METADATA.txt
          grep -Fx "WORKFLOW_RUN_ID=$UPSTREAM_RUN_ID" BUILD-METADATA.txt
          grep -q "^package: name='com.codeforge.ide'" APK-METADATA.txt
          SDK_BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$SDK_BUILD_TOOLS/apksigner" verify --verbose --print-certs CodeForge.apk | tee ANDROID-SIGNING-VERIFICATION.txt
          EXPECTED_ANDROID="$(printf '%s' "$ANDROID_SIGNING_CERT_SHA256" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          ACTUAL_ANDROID="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' ANDROID-SIGNING-VERIFICATION.txt | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]' | head -n 1)"
          METADATA_ANDROID="$(sed -n 's/^CERT_SHA256=//p' ANDROID-SIGNING-METADATA.txt | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]' | head -n 1)"
          [[ "$EXPECTED_ANDROID" =~ ^[A-F0-9]{64}$ ]]
          test "$ACTUAL_ANDROID" = "$EXPECTED_ANDROID"
          test "$METADATA_ANDROID" = "$EXPECTED_ANDROID"
          ANDROID_SHA="$(awk '{print $1}' SHA256-Android.txt)"
          {
            printf '# CodeForge Android v1.0.%s\n\n' "${{ github.event.workflow_run.run_number }}"
            printf 'The Android APK was built from commit %s and passed production signer, package, checksum and provenance verification.\n\n' "$SOURCE_SHA"
            printf '## Android\n- Package: com.codeforge.ide\n- File: CodeForge.apk\n- SHA-256: %s\n- Signer certificate SHA-256: %s\n\n' "$ANDROID_SHA" "$ACTUAL_ANDROID"
            printf '## Build provenance\n- Commit: %s\n- Installer workflow run: %s\n- Version: 1.0.%s\n- Version code: %s\n' "$SOURCE_SHA" "$UPSTREAM_RUN_ID" "${{ github.event.workflow_run.run_number }}" "${{ github.event.workflow_run.run_number }}"
          } > ../RELEASE-NOTES.md
          printf '%s  CodeForge.apk\n' "$ANDROID_SHA" > ../SHA256SUMS.txt

      - name: Prevent out-of-order release publication
        id: sequence
        if: steps.eligibility.outputs.release_ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: node scripts/check-release-sequence.mjs

      - name: Create verified draft Android release
        if: steps.eligibility.outputs.release_ready == 'true' && steps.sequence.outputs.release_ready == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.event.workflow_run.run_number }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: CodeForge Android v1.0.${{ github.event.workflow_run.run_number }}
          draft: true
          make_latest: false
          body_path: release/RELEASE-NOTES.md
          fail_on_unmatched_files: true
          files: |
            release/android/CodeForge.apk
            release/android/ANDROID-SIGNING-METADATA.txt
            release/android/ANDROID-SIGNING-VERIFICATION.txt
            release/android/APK-METADATA.txt
            release/android/BUILD-METADATA.txt
            release/android/SHA256-Android.txt
            release/SHA256SUMS.txt
            release/RELEASE-NOTES.md

      - name: Publish verified Android release
        if: steps.eligibility.outputs.release_ready == 'true' && steps.sequence.outputs.release_ready == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.event.workflow_run.run_number }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: CodeForge Android v1.0.${{ github.event.workflow_run.run_number }}
          draft: false
          make_latest: true
          body_path: release/RELEASE-NOTES.md

      - name: Verify published APK download
        if: steps.eligibility.outputs.release_ready == 'true' && steps.sequence.outputs.release_ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v1.0.${{ github.event.workflow_run.run_number }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json isDraft,assets > release/published-release.json
          jq -e '.isDraft == false and any(.assets[]; .name == "CodeForge.apk" and .size > 0) and any(.assets[]; .name == "SHA256SUMS.txt" and .size > 0)' release/published-release.json >/dev/null
          mkdir -p release/download-check
          gh release download "$TAG" --pattern CodeForge.apk --dir release/download-check
          cmp release/android/CodeForge.apk release/download-check/CodeForge.apk
          EXPECTED="$(awk '{print $1}' release/android/SHA256-Android.txt)"
          ACTUAL="$(sha256sum release/download-check/CodeForge.apk | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          echo "Published verified Android APK release $TAG and confirmed its public download checksum." >> "$GITHUB_STEP_SUMMARY"
