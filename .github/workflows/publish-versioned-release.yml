name: Publish verified paired CodeForge release

on:
  workflow_run:
    workflows: ["CodeForge production installers"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

concurrency:
  group: codeforge-paired-release-publisher
  cancel-in-progress: false

jobs:
  verify-windows:
    name: Verify durable Windows Authenticode signature
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Verify exact source revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Download Windows installer artifact
        uses: actions/download-artifact@v8
        with:
          name: codeforge-windows-installer
          path: release/windows
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Verify Windows signature, certificate, checksum, and provenance
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_THUMBPRINT: ${{ vars.WINDOWS_SIGNING_CERT_THUMBPRINT }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          $ErrorActionPreference = "Stop"
          $requiredFiles = @(
            "release/windows/CodeForge-Setup-Windows.exe",
            "release/windows/CodeForge-Windows-Certificate.cer",
            "release/windows/WINDOWS-SIGNING-METADATA.txt",
            "release/windows/BUILD-METADATA.txt",
            "release/windows/SHA256-Windows.txt"
          )
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) { throw "Missing Windows production release file: $file" }
          }
          $metadata = Get-Content release/windows/WINDOWS-SIGNING-METADATA.txt
          foreach ($required in @("SIGNING=durable", "SIGNATURE_STATUS=Valid", "SIGNING_PROVIDER=SignPath Foundation")) {
            if ($metadata -notcontains $required) { throw "Windows signing metadata is missing required value: $required" }
          }
          $expectedThumbprint = ($env:WINDOWS_SIGNING_CERT_THUMBPRINT -replace "[^0-9A-Fa-f]", "").ToUpperInvariant()
          if ($expectedThumbprint -notmatch "^[0-9A-F]{40}$") { throw "WINDOWS_SIGNING_CERT_THUMBPRINT must be a 40-character SHA-1 thumbprint." }
          $actualThumbprint = (($metadata | Where-Object { $_ -like "THUMBPRINT=*" } | Select-Object -First 1) -replace "^THUMBPRINT=", "").ToUpperInvariant()
          if ($actualThumbprint -ne $expectedThumbprint) { throw "The Windows signing metadata thumbprint does not match the configured SignPath certificate." }
          $signature = Get-AuthenticodeSignature release/windows/CodeForge-Setup-Windows.exe
          if ($signature.Status -ne "Valid" -or -not $signature.SignerCertificate) { throw "Windows Authenticode signature is not valid: $($signature.Status)" }
          if ($signature.SignerCertificate.Thumbprint.ToUpperInvariant() -ne $expectedThumbprint) { throw "The Windows installer was signed by an unexpected certificate." }
          if (-not $signature.TimeStamperCertificate) { throw "The Windows Authenticode signature has no trusted timestamp certificate." }
          $recordedTimestampThumbprint = (($metadata | Where-Object { $_ -like "TIMESTAMP_CERT_THUMBPRINT=*" } | Select-Object -First 1) -replace "^TIMESTAMP_CERT_THUMBPRINT=", "").ToUpperInvariant()
          if ($recordedTimestampThumbprint -ne $signature.TimeStamperCertificate.Thumbprint.ToUpperInvariant()) { throw "The Windows timestamp certificate does not match signing metadata." }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw "Windows SDK signtool.exe was not found." }
          & $signtool.FullName verify /pa /all /v release/windows/CodeForge-Setup-Windows.exe
          if ($LASTEXITCODE -ne 0) { throw "Windows Authenticode policy verification failed on the release publisher." }
          $certHash = (Get-FileHash release/windows/CodeForge-Windows-Certificate.cer -Algorithm SHA256).Hash.ToLowerInvariant()
          $recordedCertHash = (($metadata | Where-Object { $_ -like "CERT_FILE_SHA256=*" } | Select-Object -First 1) -replace "^CERT_FILE_SHA256=", "").ToLowerInvariant()
          if ($certHash -ne $recordedCertHash) { throw "The exported public Windows certificate does not match its signing metadata." }
          $installerHash = (Get-FileHash release/windows/CodeForge-Setup-Windows.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumLine = Get-Content release/windows/SHA256-Windows.txt
          if ($checksumLine -notmatch "^([a-f0-9]{64})\s+CodeForge-Setup-Windows\.exe$" -or $Matches[1] -ne $installerHash) {
            throw "The Windows installer SHA-256 checksum does not match."
          }
          $build = Get-Content release/windows/BUILD-METADATA.txt
          foreach ($required in @("COMMIT=$env:SOURCE_SHA", "WORKFLOW_RUN_ID=$env:UPSTREAM_RUN_ID", "RUN_NUMBER=$env:RUN_NUMBER", "SIGNING=durable")) {
            if ($build -notcontains $required) { throw "Windows build provenance is missing: $required" }
          }

  verify-android:
    name: Verify durable Android APK signature
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Verify exact source revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Download Android APK artifact
        uses: actions/download-artifact@v8
        with:
          name: codeforge-android-apk
          path: release/android
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - name: Re-parse and verify Android APK package, permissions, alignment, signer, and provenance
        shell: bash
        env:
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          set -euo pipefail
          cd release/android
          for file in CodeForge.apk SHA256-Android.txt ANDROID-SIGNING-METADATA.txt ANDROID-SIGNING-VERIFICATION.txt BUILD-METADATA.txt APK-METADATA.txt APK-METADATA-FINAL.txt APK-METADATA-SHA256.txt APK-MERGED-MANIFEST-XMLTREE.txt APK-MERGED-MANIFEST-XMLTREE-FINAL.txt APK-MERGED-MANIFEST-SHA256.txt; do
            test -s "$file" || { echo "::error::Missing Android production release file: $file"; exit 1; }
          done
          sha256sum -c SHA256-Android.txt
          grep -Fx "PACKAGE=com.codeforge.ide" BUILD-METADATA.txt
          grep -Fx "VERSION=1.0.$RUN_NUMBER" BUILD-METADATA.txt
          grep -Fx "VERSION_CODE=$RUN_NUMBER" BUILD-METADATA.txt
          grep -Fx "SIGNING=durable" BUILD-METADATA.txt
          grep -Fx "COMMIT=$SOURCE_SHA" BUILD-METADATA.txt
          grep -Fx "WORKFLOW_RUN_ID=$UPSTREAM_RUN_ID" BUILD-METADATA.txt
          grep -Fx "RUN_NUMBER=$RUN_NUMBER" BUILD-METADATA.txt

          SDK_BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          test -x "$SDK_BUILD_TOOLS/aapt"
          test -x "$SDK_BUILD_TOOLS/zipalign"
          test -x "$SDK_BUILD_TOOLS/apksigner"

          # Parse the actual signed APK again; do not rely solely on build-time metadata.
          "$SDK_BUILD_TOOLS/aapt" dump badging CodeForge.apk > APK-METADATA-REVALIDATED.txt
          node ../../scripts/verify-android-apk-metadata.mjs APK-METADATA-REVALIDATED.txt "$RUN_NUMBER" "1.0.$RUN_NUMBER"
          node ../../scripts/verify-android-permissions.mjs APK-METADATA-REVALIDATED.txt
          cmp APK-METADATA.txt APK-METADATA-REVALIDATED.txt
          cmp APK-METADATA-FINAL.txt APK-METADATA-REVALIDATED.txt
          "$SDK_BUILD_TOOLS/aapt" dump xmltree CodeForge.apk AndroidManifest.xml > APK-MERGED-MANIFEST-XMLTREE-REVALIDATED.txt
          cmp APK-MERGED-MANIFEST-XMLTREE-FINAL.txt APK-MERGED-MANIFEST-XMLTREE-REVALIDATED.txt
          sha256sum -c APK-METADATA-SHA256.txt
          sha256sum -c APK-MERGED-MANIFEST-SHA256.txt
          ACTUAL_APK_SHA256="$(sha256sum CodeForge.apk | awk '{print $1}')"
          EXPECTED_APK_SHA256="$(sed -n 's/^APK_SHA256=//p' BUILD-METADATA.txt | head -n 1)"
          ACTUAL_METADATA_SHA256="$(sha256sum APK-METADATA-REVALIDATED.txt | awk '{print $1}')"
          EXPECTED_METADATA_SHA256="$(sed -n 's/^APK_METADATA_SHA256=//p' BUILD-METADATA.txt | head -n 1)"
          ACTUAL_MANIFEST_SHA256="$(sha256sum APK-MERGED-MANIFEST-XMLTREE-REVALIDATED.txt | awk '{print $1}')"
          EXPECTED_MANIFEST_SHA256="$(sed -n 's/^APK_MANIFEST_SHA256=//p' BUILD-METADATA.txt | head -n 1)"
          test "$ACTUAL_APK_SHA256" = "$EXPECTED_APK_SHA256"
          test "$ACTUAL_METADATA_SHA256" = "$EXPECTED_METADATA_SHA256"
          test "$ACTUAL_MANIFEST_SHA256" = "$EXPECTED_MANIFEST_SHA256"
          "$SDK_BUILD_TOOLS/zipalign" -c 4 CodeForge.apk
          "$SDK_BUILD_TOOLS/apksigner" verify --verbose --Werr --print-certs CodeForge.apk | tee ANDROID-SIGNING-VERIFICATION-RELEASE.txt

          EXPECTED_ANDROID="$(printf '%s' "$ANDROID_SIGNING_CERT_SHA256" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          ACTUAL_ANDROID="$(node ../../scripts/extract-apksigner-cert.mjs ANDROID-SIGNING-VERIFICATION-RELEASE.txt)"
          METADATA_ANDROID="$(sed -n 's/^CERT_SHA256=//p' ANDROID-SIGNING-METADATA.txt | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]' | head -n 1)"
          [[ "$EXPECTED_ANDROID" =~ ^[A-F0-9]{64}$ ]]
          test "$ACTUAL_ANDROID" = "$EXPECTED_ANDROID"
          test "$METADATA_ANDROID" = "$EXPECTED_ANDROID"
          echo "Android production signer, freshly parsed manifest/package/version, permission allowlist, ZIP alignment, checksum, and provenance verified."

  publish:
    name: Publish one paired Windows and Android release
    needs: [verify-windows, verify-android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Verify exact source revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Download verified Windows installer artifact
        uses: actions/download-artifact@v8
        with:
          name: codeforge-windows-installer
          path: release/windows
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Download verified Android APK artifact
        uses: actions/download-artifact@v8
        with:
          name: codeforge-android-apk
          path: release/android
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Assemble paired release notes and checksums
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          WINDOWS_SIGNING_CERT_THUMBPRINT: ${{ vars.WINDOWS_SIGNING_CERT_THUMBPRINT }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for file in CodeForge-Setup-Windows.exe CodeForge-Windows-Certificate.cer WINDOWS-SIGNING-METADATA.txt BUILD-METADATA.txt SHA256-Windows.txt; do
            test -s "release/windows/$file"
          done
          for file in CodeForge.apk ANDROID-SIGNING-METADATA.txt ANDROID-SIGNING-VERIFICATION.txt APK-METADATA.txt APK-METADATA-FINAL.txt APK-METADATA-SHA256.txt APK-MERGED-MANIFEST-XMLTREE.txt APK-MERGED-MANIFEST-XMLTREE-FINAL.txt APK-MERGED-MANIFEST-SHA256.txt BUILD-METADATA.txt SHA256-Android.txt; do
            test -s "release/android/$file"
          done
          (cd release/windows && sha256sum -c SHA256-Windows.txt)
          (cd release/android && sha256sum -c SHA256-Android.txt)
          grep -Fx "COMMIT=$SOURCE_SHA" release/windows/BUILD-METADATA.txt
          grep -Fx "WORKFLOW_RUN_ID=$UPSTREAM_RUN_ID" release/windows/BUILD-METADATA.txt
          grep -Fx "COMMIT=$SOURCE_SHA" release/android/BUILD-METADATA.txt
          grep -Fx "WORKFLOW_RUN_ID=$UPSTREAM_RUN_ID" release/android/BUILD-METADATA.txt
          grep -Fx "SIGNING=durable" release/windows/BUILD-METADATA.txt
          grep -Fx "SIGNING=durable" release/android/BUILD-METADATA.txt
          grep -Fx "SIGNING_PROVIDER=SignPath Foundation" release/windows/WINDOWS-SIGNING-METADATA.txt
          grep -Fx "SIGNATURE_STATUS=Valid" release/windows/WINDOWS-SIGNING-METADATA.txt
          grep -Fx "SIGNING=durable" release/windows/WINDOWS-SIGNING-METADATA.txt
          grep -Fx "SIGNING=durable" release/android/ANDROID-SIGNING-METADATA.txt
          WINDOWS_EXPECTED="$(printf '%s' "$WINDOWS_SIGNING_CERT_THUMBPRINT" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          WINDOWS_ACTUAL="$(sed -n 's/^THUMBPRINT=//p' release/windows/WINDOWS-SIGNING-METADATA.txt | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]' | head -n 1)"
          test "$WINDOWS_ACTUAL" = "$WINDOWS_EXPECTED"
          ANDROID_EXPECTED="$(printf '%s' "$ANDROID_SIGNING_CERT_SHA256" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          ANDROID_ACTUAL="$(sed -n 's/^CERT_SHA256=//p' release/android/ANDROID-SIGNING-METADATA.txt | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]' | head -n 1)"
          test "$ANDROID_ACTUAL" = "$ANDROID_EXPECTED"
          WINDOWS_SHA="$(awk '{print $1}' release/windows/SHA256-Windows.txt)"
          ANDROID_SHA="$(awk '{print $1}' release/android/SHA256-Android.txt)"
          {
            printf '%s  CodeForge-Setup-Windows.exe\n' "$WINDOWS_SHA"
            printf '%s  CodeForge.apk\n' "$ANDROID_SHA"
          } > release/SHA256SUMS.txt
          {
            printf '# CodeForge v1.0.%s — Windows + Android\n\n' "$RUN_NUMBER"
            printf 'This paired release was built from commit %s. Both installers passed exact-source, signature, signer-identity, package, and checksum verification.\n\n' "$SOURCE_SHA"
            printf '## Windows desktop\n- File: CodeForge-Setup-Windows.exe\n- SHA-256: %s\n- Signing: **SignPath Foundation — publicly trusted Authenticode**\n- Certificate thumbprint: %s\n\n' "$WINDOWS_SHA" "$WINDOWS_ACTUAL"
            printf '## Android\n- Package: com.codeforge.ide\n- File: CodeForge.apk\n- SHA-256: %s\n- Signing: **CodeForge production release keystore**\n- Certificate SHA-256: %s\n\n' "$ANDROID_SHA" "$ANDROID_ACTUAL"
            printf '## Build provenance\n- Source commit: %s\n- Production installer workflow run: %s\n- Version: 1.0.%s\n- Android version code: %s\n' "$SOURCE_SHA" "$UPSTREAM_RUN_ID" "$RUN_NUMBER" "$RUN_NUMBER"
          } > release/RELEASE-NOTES.md

      - name: Prevent out-of-order release publication
        id: sequence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: node scripts/check-release-sequence.mjs

      - name: Refuse to overwrite an existing release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v1.0.${{ github.event.workflow_run.run_number }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release tag $TAG already exists; refusing to overwrite."
            exit 1
          fi

      - name: Create paired verified draft release
        if: steps.sequence.outputs.release_ready == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.event.workflow_run.run_number }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: CodeForge v1.0.${{ github.event.workflow_run.run_number }} — Windows + Android
          draft: true
          make_latest: false
          body_path: release/RELEASE-NOTES.md
          fail_on_unmatched_files: true
          files: |
            release/windows/CodeForge-Setup-Windows.exe
            release/windows/CodeForge-Windows-Certificate.cer
            release/windows/WINDOWS-SIGNING-METADATA.txt
            release/windows/SHA256-Windows.txt
            release/android/CodeForge.apk
            release/android/ANDROID-SIGNING-METADATA.txt
            release/android/ANDROID-SIGNING-VERIFICATION.txt
            release/android/APK-METADATA.txt
            release/android/SHA256-Android.txt
            release/SHA256SUMS.txt
            release/RELEASE-NOTES.md

      - name: Publish paired verified release
        if: steps.sequence.outputs.release_ready == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.event.workflow_run.run_number }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: CodeForge v1.0.${{ github.event.workflow_run.run_number }} — Windows + Android
          draft: false
          make_latest: true
          body_path: release/RELEASE-NOTES.md

      - name: Verify public paired release downloads
        if: steps.sequence.outputs.release_ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v1.0.${{ github.event.workflow_run.run_number }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json isDraft,assets > release/published-release.json
          jq -e '.isDraft == false and
            any(.assets[]; .name == "CodeForge-Setup-Windows.exe" and .size > 0) and
            any(.assets[]; .name == "CodeForge.apk" and .size > 0) and
            any(.assets[]; .name == "SHA256SUMS.txt" and .size > 0) and
            any(.assets[]; .name == "CodeForge-Windows-Certificate.cer" and .size > 0)' \
            release/published-release.json >/dev/null
          mkdir -p release/download-check
          gh release download "$TAG" --pattern CodeForge-Setup-Windows.exe --dir release/download-check
          gh release download "$TAG" --pattern CodeForge.apk --dir release/download-check
          cmp release/windows/CodeForge-Setup-Windows.exe release/download-check/CodeForge-Setup-Windows.exe
          cmp release/android/CodeForge.apk release/download-check/CodeForge.apk
          EXPECTED_WINDOWS="$(awk '{print $1}' release/windows/SHA256-Windows.txt)"
          ACTUAL_WINDOWS="$(sha256sum release/download-check/CodeForge-Setup-Windows.exe | awk '{print $1}')"
          EXPECTED_ANDROID="$(awk '{print $1}' release/android/SHA256-Android.txt)"
          ACTUAL_ANDROID="$(sha256sum release/download-check/CodeForge.apk | awk '{print $1}')"
          test "$ACTUAL_WINDOWS" = "$EXPECTED_WINDOWS"
          test "$ACTUAL_ANDROID" = "$EXPECTED_ANDROID"
          echo "Published paired Windows+Android release $TAG; both signed installer downloads match the verified artifacts." >> "$GITHUB_STEP_SUMMARY"
