name: Deploy CodeForge Worker

on:
  pull_request:
    types:
      - closed
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: codeforge-worker-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact source revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Validate deployment configuration
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Install locked web dependencies
        run: npm --prefix apps/web ci --no-audit --no-fund
      - name: Dependency security audit
        run: npm --prefix apps/web audit --audit-level=high
      - name: Unit and regression tests
        run: npm --prefix apps/web test
      - name: Type-check
        run: npm --prefix apps/web run typecheck
      - name: Build web assets
        run: npm --prefix apps/web run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Validate Worker bundle before touching production
        run: npx --yes wrangler@4 deploy --dry-run
      - name: Configure Worker auth key
        run: printf '%s' "$VITE_SUPABASE_PUBLISHABLE_KEY" | npx --yes wrangler@4 secret put SUPABASE_PUBLISHABLE_KEY
        env:
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply D1 migrations
        run: npx --yes wrangler@4 d1 execute k --remote --file=migrations/0005_code_change_requests.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply workspace search revision migration
        run: npx --yes wrangler@4 d1 execute k --remote --file=migrations/0006_workspace_search_revisions.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker and static assets
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Probe production Worker and static assets
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://codeforge-ide.vasudevaya.workers.dev"
          curl --fail --show-error --silent --retry 5 --retry-all-errors --retry-delay 3 "$BASE_URL/api/health" -o health.json
          node -e "const h=require('./health.json'); if(h.ok!==true || h.database!=='connected') process.exit(1)"
          curl --fail --show-error --silent --retry 5 --retry-all-errors --retry-delay 3 "$BASE_URL/api/config" -o /dev/null
          curl --fail --show-error --silent --retry 5 --retry-all-errors --retry-delay 3 "$BASE_URL/" -o /dev/null
          curl --fail --show-error --silent --retry 5 --retry-all-errors --retry-delay 3 "$BASE_URL/app" -o /dev/null
          STATUS="$(curl --silent --output auth-probe.json --write-out '%{http_code}' "$BASE_URL/api/workspaces")"
          test "$STATUS" = "401"
          grep -q "Authentication required" auth-probe.json
          printf 'Production health, config, SPA assets, and unauthenticated API guard passed.\n'
