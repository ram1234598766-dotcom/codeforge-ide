name: Release policy regression tests

on:
  pull_request:
    paths:
      - "apps/web/src/main.tsx"
      - "apps/web/src/lib/release.ts"
      - ".github/workflows/production-installers.yml"
      - "apps/mobile/App.tsx"
      - "apps/web/src/styles.css"
      - "scripts/android-install-smoke.sh"
      - "scripts/verify-android-webview.mjs"
      - "scripts/verify-hosted-app.mjs"
      - "scripts/verify-hosted-app.test.mjs"
      - ".github/workflows/native-shells-ci.yml"
      - ".github/workflows/publish-versioned-release.yml"
      - ".github/workflows/android-apk.yml"
      - ".github/workflows/codeforge-worker-ci.yml"
      - ".github/workflows/deploy-worker.yml"
      - ".github/workflows/release-policy.yml"
      - "scripts/verify-release-pipeline.mjs"
      - "scripts/check-release-sequence.mjs"
      - "migrations/0005_code_change_requests.sql"
      - "migrations/0006_workspace_search_revisions.sql"
      - "scripts/test-d1-migrations.py"
  push:
    branches: [main]
    paths:
      - "apps/web/src/main.tsx"
      - "apps/web/src/lib/release.ts"
      - ".github/workflows/production-installers.yml"
      - "apps/mobile/App.tsx"
      - "apps/web/src/styles.css"
      - "scripts/android-install-smoke.sh"
      - "scripts/verify-android-webview.mjs"
      - "scripts/verify-hosted-app.mjs"
      - "scripts/verify-hosted-app.test.mjs"
      - ".github/workflows/native-shells-ci.yml"
      - ".github/workflows/publish-versioned-release.yml"
      - ".github/workflows/android-apk.yml"
      - ".github/workflows/codeforge-worker-ci.yml"
      - ".github/workflows/deploy-worker.yml"
      - ".github/workflows/release-policy.yml"
      - "scripts/verify-release-pipeline.mjs"
      - "scripts/check-release-sequence.mjs"
      - "migrations/0005_code_change_requests.sql"
      - "migrations/0006_workspace_search_revisions.sql"
      - "scripts/test-d1-migrations.py"

permissions:
  contents: read

jobs:
  release-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse GitHub Actions workflow YAML
        run: |
          ruby -e 'require "yaml"; Dir[".github/workflows/*.yml"].each { |path| YAML.load_file(path, aliases: true); puts "valid YAML: #{path}" }'
      - name: Test D1 migrations on a disposable SQLite fixture
        run: python3 scripts/test-d1-migrations.py
      - name: Verify Android WebView readiness contract
        run: node scripts/verify-android-webview.mjs
      - name: Run hosted route regression tests
        run: node --test scripts/verify-hosted-app.test.mjs
      - name: Verify durable signing and download gates
        run: node scripts/verify-release-pipeline.mjs
