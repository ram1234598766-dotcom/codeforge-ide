name: Native shells CI

permissions:
  contents: read

concurrency:
  group: native-shells-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
      - name: Verify Android WebView readiness contract
        run: node scripts/verify-android-webview.mjs
      - name: Verify hosted CodeForge routes and assets
        run: node scripts/verify-hosted-app.mjs
      - name: Run hosted route regression tests
        run: node --test scripts/verify-hosted-app.test.mjs
      - name: Pin npm to 11.19.0 for peer-graph stability
        run: npm install --global npm@11.19.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - name: Install Expo dependencies and create lockfile
        working-directory: apps/mobile
        run: npm install --no-audit --no-fund --package-lock=true
      - name: Audit Android client dependencies
        working-directory: apps/mobile
        run: npm audit --audit-level=high
      - name: Expo diagnostics
        working-directory: apps/mobile
        run: npx expo-doctor
      - name: Export Android and iOS bundles
        run: npx --yes pnpm@9.15.0 --filter @codeforge/mobile run build
      - name: Generate Android native project
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: "1"
        run: npx expo prebuild --platform android --clean --no-install
      - name: Assemble unsigned release and debug APKs
        working-directory: apps/mobile/android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          for attempt in 1 2 3; do
            echo "Gradle native build attempt $attempt/3"
            if ./gradlew --no-daemon --stacktrace --refresh-dependencies :app:assembleRelease :app:assembleDebug; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Android native build failed after three logged attempts."
              exit 1
            fi
            sleep "$((attempt * 10))"
          done
      - name: Verify Android APK package, alignment, and debug signature
        shell: bash
        run: |
          set -euo pipefail
          SDK_BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          RELEASE_APK="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          DEBUG_APK="apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$RELEASE_APK"
          test -s "$DEBUG_APK"
          mkdir -p release
          "$SDK_BUILD_TOOLS/aapt" dump badging "$RELEASE_APK" > release/ANDROID-RELEASE-METADATA.txt
          "$SDK_BUILD_TOOLS/aapt" dump badging "$DEBUG_APK" > release/ANDROID-DEBUG-METADATA.txt
          MERGER_REPORT="apps/mobile/android/app/build/outputs/logs/manifest-merger-release-report.txt"
          if [[ -f "$MERGER_REPORT" ]]; then
            cp "$MERGER_REPORT" release/ANDROID-RELEASE-MANIFEST-MERGER.txt
            grep -E "uses-permission|android.permission" "$MERGER_REPORT" || true
          fi
          grep -q "^package: name='com.codeforge.ide'" release/ANDROID-RELEASE-METADATA.txt
          grep -q "^package: name='com.codeforge.ide'" release/ANDROID-DEBUG-METADATA.txt
          "$SDK_BUILD_TOOLS/zipalign" -c 4 "$RELEASE_APK"
          "$SDK_BUILD_TOOLS/zipalign" -c 4 "$DEBUG_APK"
          "$SDK_BUILD_TOOLS/apksigner" verify --verbose --print-certs "$DEBUG_APK" | tee release/ANDROID-DEBUG-SIGNATURE.txt
      - name: Verify Android permission allowlist
        run: node scripts/verify-android-permissions.mjs release/ANDROID-RELEASE-METADATA.txt release/ANDROID-DEBUG-METADATA.txt
      - name: Stage Android CI APKs and checksums
        shell: bash
        run: |
          set -euo pipefail
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk release/CodeForge-unsigned.apk
          cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk release/CodeForge-debug.apk
          (cd release && sha256sum CodeForge-unsigned.apk CodeForge-debug.apk > SHA256-Android-CI.txt)
      - name: Validate Android smoke script syntax
        run: bash -n scripts/android-install-smoke.sh
      - name: Enable KVM for hardware-accelerated Android emulator
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
          ls -l /dev/kvm
      - name: Reclaim build-only disk space before emulator provisioning
        shell: bash
        run: |
          set -euo pipefail
          test -s release/CodeForge-debug.apk
          test -s release/CodeForge-unsigned.apk
          echo "Filesystem usage before emulator cleanup:"
          df -h /
          du -sh node_modules apps/mobile/node_modules apps/mobile/.expo "$HOME/.gradle/caches" "$HOME/.gradle/wrapper/dists" "$ANDROID_HOME/build-tools" "$ANDROID_HOME/platforms" 2>/dev/null || true
          rm -rf node_modules apps/mobile/node_modules apps/mobile/.expo
          rm -rf apps/mobile/android/app/build apps/mobile/android/build
          rm -rf "$HOME/.gradle/caches" "$HOME/.gradle/daemon" "$HOME/.gradle/wrapper/dists" "$HOME/.npm/_cacache"
          rm -rf "$ANDROID_HOME/build-tools" "$ANDROID_HOME/platforms" "$ANDROID_HOME/ndk" "$ANDROID_HOME/cmake" "$ANDROID_HOME/system-images" "$ANDROID_HOME/emulator"
          echo "Filesystem usage after emulator cleanup:"
          df -h /
          AVAILABLE_KB="$(df -Pk / | awk 'NR == 2 { print $4 }')"
          if [[ "$AVAILABLE_KB" -lt 5242880 ]]; then
            echo "::error::Less than 5 GiB remains for Android emulator provisioning."
            exit 1
          fi
          test -s release/CodeForge-debug.apk
          test -s release/CodeForge-unsigned.apk
      - name: Install and launch Android app in disposable emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-linux-hw-accel: false
          disable-animations: true
          script: bash scripts/android-install-smoke.sh release/CodeForge-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeforge-android-ci-apks-and-smoke-diagnostics
          path: release/*
          if-no-files-found: warn
          retention-days: 7

  dependency-automation-policy:
    name: Validate dependency update coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse Dependabot YAML
        run: |
          ruby -e 'require "yaml"; YAML.load_file(".github/dependabot.yml", aliases: true); puts "Dependabot YAML is valid."'
      - name: Verify scheduled dependency coverage
        run: node scripts/verify-dependabot-config.mjs

  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pin npm to 11.19.0 for peer-graph stability
        run: npm install --global npm@11.19.0
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf libwebkit2gtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Install desktop dependencies
        run: npm --prefix apps/desktop install --no-audit --no-fund
      - name: Audit Linux desktop dependencies
        run: npm --prefix apps/desktop audit --audit-level=high
      - name: Build Tauri desktop shell
        run: npm --prefix apps/desktop run build

  windows:
    name: Build and install-smoke Windows NSIS installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pin npm to 11.19.0 for peer-graph stability
        run: npm install --global npm@11.19.0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund
      - name: Audit Windows desktop dependencies
        working-directory: apps/desktop
        run: npm audit --audit-level=high
      - name: Generate platform icons
        working-directory: apps/desktop
        run: npx tauri icon src-tauri/icons/icon.png
      - name: Build Windows NSIS installer
        working-directory: apps/desktop
        run: npx tauri build --bundles nsis
      - name: Install, launch, verify, and uninstall on the disposable runner
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe | Sort-Object FullName | Select-Object -First 1
          if (-not $installer -or $installer.Length -le 0) { throw "Tauri did not produce a non-empty Windows installer." }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne "NotSigned") { throw "Build-only Windows CI expected an unsigned artifact; got $($signature.Status)." }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item $installer.FullName release/CodeForge-Setup-Windows.exe
          $hash = (Get-FileHash release/CodeForge-Setup-Windows.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  CodeForge-Setup-Windows.exe" | Set-Content -Path release/SHA256-Windows-CI.txt -Encoding ascii -NoNewline
          $install = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Silent NSIS install failed with exit code $($install.ExitCode)." }
          $installed = Get-ChildItem "$env:LOCALAPPDATA" -File -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Name -in @("codeforge-desktop.exe", "CodeForge.exe") } | Select-Object -First 1
          if (-not $installed) { throw "The Tauri main binary was not found after silent installation." }
          $launch = Start-Process -FilePath $installed.FullName -PassThru
          Start-Sleep -Seconds 15
          $launch.Refresh()
          if ($launch.HasExited) { throw "The installed CodeForge application exited during launch smoke test with code $($launch.ExitCode)." }
          Stop-Process -Id $launch.Id -Force
          $launch.WaitForExit()
          "Windows application launch smoke test passed." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $uninstaller = Get-ChildItem $installed.Directory.FullName -File -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Name -in @("uninstall.exe", "unins000.exe") } | Select-Object -First 1
          if (-not $uninstaller) { throw "The installed application did not contain a discoverable NSIS uninstaller." }
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList "/S" -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) { throw "Silent NSIS uninstall failed with exit code $($uninstall.ExitCode)." }
          if (Test-Path $installed.FullName) { throw "The Tauri main binary remained after uninstall smoke test." }
          "Windows NSIS install/uninstall smoke test passed. SHA-256: $hash" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($env:RUNNER_ARCH -ne "X64") { throw "Windows installer CI requires the x64 hosted runner; got $env:RUNNER_ARCH." }
          $tauriConfig = Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $desktopPackage = Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json
          $installerSize = (Get-Item release/CodeForge-Setup-Windows.exe).Length
          @(
            "COMMIT=$env:GITHUB_SHA",
            "WORKFLOW_RUN_ID=$env:GITHUB_RUN_ID",
            "PRODUCT=$($tauriConfig.productName)",
            "APP_VERSION=$($tauriConfig.version)",
            "PACKAGE_VERSION=$($desktopPackage.version)",
            "IDENTIFIER=$($tauriConfig.identifier)",
            "TARGET_TRIPLE=x86_64-pc-windows-msvc",
            "RUNNER_OS=$env:RUNNER_OS",
            "RUNNER_ARCH=$env:RUNNER_ARCH",
            "BUNDLE=NSIS",
            "INSTALL_MODE=$($tauriConfig.bundle.windows.nsis.installMode)",
            "SIGNING=unsigned",
            "AUTHENTICODE_STATUS=$($signature.Status)",
            "SHA256=$hash",
            "SIZE_BYTES=$installerSize"
          ) | Set-Content -Path release/BUILD-METADATA-Windows.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: codeforge-windows-ci-installer
          path: release/*
          if-no-files-found: error
          retention-days: 7

  workflow-lint:
    name: Validate workflow YAML and release policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse GitHub Actions workflow YAML
        run: |
          ruby -e 'require "yaml"; Dir[".github/workflows/*.yml"].each { |path| YAML.load_file(path, aliases: true); puts "valid YAML: #{path}" }'
      - name: Test Android permission policy
        run: node --test scripts/verify-android-permissions.test.mjs
      - name: Verify release signing and download gates
        run: node scripts/verify-release-pipeline.mjs
