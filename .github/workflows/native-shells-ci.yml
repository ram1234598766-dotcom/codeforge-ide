name: Native shells CI

concurrency:
  group: native-shells-ci-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
      - name: Install Expo dependencies
        working-directory: apps/mobile
        run: npm install --no-audit --no-fund --package-lock=true
      - name: Generate pnpm workspace lockfile for Expo diagnostics
        run: npx --yes pnpm@9.15.0 install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Expo diagnostics
        working-directory: apps/mobile
        run: npx expo-doctor
      - name: Export Android and iOS bundles
        run: npm --prefix apps/mobile run build

  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf libwebkit2gtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Install desktop dependencies
        run: npm --prefix apps/desktop install --no-audit --no-fund
      - name: Build Tauri desktop shell
        run: npm --prefix apps/desktop run build
