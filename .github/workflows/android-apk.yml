name: CodeForge Android Preview APK

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android-apk.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeforge-android-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    name: Build and sign Android preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Install Expo dependencies
        working-directory: apps/mobile
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Generate native Android project
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: "1"
        run: npx expo prebuild --platform android --clean --no-install

      - name: Assemble release APK
        working-directory: apps/mobile/android
        env:
          EXPO_NO_TELEMETRY: "1"
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Align, sign, and verify APK
        shell: bash
        env:
          EXPO_NO_TELEMETRY: "1"
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          APK_PATH="$(find apps/mobile/android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          SDK_BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          mkdir -p release
          SOURCE_SHA="$(git rev-parse HEAD)"
          test "$SOURCE_SHA" = "$EXPECTED_SHA"
          "$SDK_BUILD_TOOLS/aapt" dump badging "$APK_PATH" > release/APK-METADATA.txt
          head -n 5 release/APK-METADATA.txt
          "$SDK_BUILD_TOOLS/zipalign" -p -f 4 "$APK_PATH" release/CodeForge-unaligned.apk
          KEYSTORE_PATH="release/codeforge-preview.jks"
          STORE_PASSWORD="$(openssl rand -hex 32)"
          KEY_PASSWORD="$(openssl rand -hex 32)"
          trap 'rm -f "$KEYSTORE_PATH" release/CodeForge-unaligned.apk' EXIT
          keytool -genkeypair -v -storetype JKS -keystore "$KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -alias codeforge -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=CodeForge Preview,O=CodeForge,C=IN"
          export KEYSTORE_PASSWORD="$STORE_PASSWORD"
          export KEY_PASSWORD
          "$SDK_BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE_PATH" --ks-key-alias codeforge \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out release/CodeForge.apk release/CodeForge-unaligned.apk
          "$SDK_BUILD_TOOLS/apksigner" verify --verbose --print-certs release/CodeForge.apk | tee release/ANDROID-SIGNING-VERIFICATION.txt
          sha256sum release/CodeForge.apk > release/SHA256SUMS.txt
          printf 'COMMIT=%s\n' "$SOURCE_SHA" > release/BUILD-METADATA.txt
          printf 'WORKFLOW_RUN_ID=%s\n' "$GITHUB_RUN_ID" >> release/BUILD-METADATA.txt
          printf 'PACKAGE=com.codeforge.ide\n' >> release/BUILD-METADATA.txt
          printf 'SIGNING=temporary preview key; not suitable for production updates\n' >> release/BUILD-METADATA.txt

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: CodeForge-Android-preview-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            release/CodeForge.apk
            release/SHA256SUMS.txt
            release/BUILD-METADATA.txt
            release/APK-METADATA.txt
            release/ANDROID-SIGNING-VERIFICATION.txt
          if-no-files-found: error
          retention-days: 30
