name: CodeForge Android APK

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android-apk.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeforge-android-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    name: Build Android release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Install Expo dependencies
        working-directory: apps/mobile
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Generate native Android project
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: "1"
        run: npx expo prebuild --platform android --clean --no-install

      - name: Assemble release APK
        working-directory: apps/mobile/android
        env:
          EXPO_NO_TELEMETRY: "1"
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Stage APK and Android signing tools
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(find apps/mobile/android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          SDK_BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          mkdir -p release/sign-tools
          cp "$APK_PATH" release/CodeForge-android-build.apk
          cp "$SDK_BUILD_TOOLS/zipalign" release/sign-tools/
          cp "$SDK_BUILD_TOOLS/apksigner" release/sign-tools/
          cp -R "$SDK_BUILD_TOOLS/lib" release/sign-tools/
          "$SDK_BUILD_TOOLS/aapt" dump badging release/CodeForge-android-build.apk | head -n 5
          sha256sum release/CodeForge-android-build.apk > release/SHA256SUMS.txt
          printf 'APK_SOURCE=%s\n' "$APK_PATH" > release/BUILD-METADATA.txt
          printf 'COMMIT=%s\n' "$GITHUB_SHA" >> release/BUILD-METADATA.txt
          printf 'BUILD_TOOLS=%s\n' "$(basename "$SDK_BUILD_TOOLS")" >> release/BUILD-METADATA.txt

      - name: Upload APK build and public signing tools
        uses: actions/upload-artifact@v4
        with:
          name: codeforge-android-build-${{ github.sha }}
          path: |
            release/CodeForge-android-build.apk
            release/SHA256SUMS.txt
            release/BUILD-METADATA.txt
            release/sign-tools/
          if-no-files-found: error
          retention-days: 7
