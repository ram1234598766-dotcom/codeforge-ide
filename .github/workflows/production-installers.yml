name: CodeForge production installers

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "apps/mobile/**"
      - "apps/web/**"
      - ".github/workflows/production-installers.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeforge-production-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build Windows desktop installer
    concurrency:
      group: codeforge-windows-build-${{ github.ref }}
      cancel-in-progress: true
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund
      - name: Generate platform icons
        working-directory: apps/desktop
        run: npx tauri icon src-tauri/icons/icon.png
      - name: Build Windows NSIS installer
        working-directory: apps/desktop
        run: npx tauri build --bundles nsis
      - name: Stage Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe | Sort-Object FullName | Select-Object -First 1
          if (-not $installer) { throw "Tauri did not produce a Windows NSIS installer." }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item $installer.FullName release/CodeForge-Setup-Windows.exe
      - name: Detect durable Windows signing configuration
        id: windows-signing
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          WINDOWS_SIGNING_CERT_THUMBPRINT: ${{ vars.WINDOWS_SIGNING_CERT_THUMBPRINT }}
        run: |
          $required = @(
            [pscustomobject]@{ Name = 'WINDOWS_SIGNING_PFX_BASE64'; Value = $env:WINDOWS_SIGNING_PFX_BASE64 },
            [pscustomobject]@{ Name = 'WINDOWS_SIGNING_PFX_PASSWORD'; Value = $env:WINDOWS_SIGNING_PFX_PASSWORD },
            [pscustomobject]@{ Name = 'WINDOWS_SIGNING_CERT_THUMBPRINT'; Value = $env:WINDOWS_SIGNING_CERT_THUMBPRINT }
          )
          $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace($_.Value) } | ForEach-Object { $_.Name })
          if ($missing.Count -gt 0) {
            "configured=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "::notice::Windows installer will remain unsigned; production release is blocked until these settings exist: $($missing -join ', ')"
          } else {
            "configured=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
      - name: Sign with durable Authenticode certificate
        if: steps.windows-signing.outputs.configured == 'true'
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          WINDOWS_SIGNING_CERT_THUMBPRINT: ${{ vars.WINDOWS_SIGNING_CERT_THUMBPRINT }}
        run: |
          $ErrorActionPreference = "Stop"
          $pfxPath = Join-Path $env:RUNNER_TEMP "codeforge-production-signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64))
          $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $pfxPath,
            $env:WINDOWS_SIGNING_PFX_PASSWORD,
            [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          )
          try {
            if (-not $cert.HasPrivateKey) { throw "The configured Windows PFX does not contain a private key." }
            $now = Get-Date
            if ($cert.NotBefore -gt $now -or $cert.NotAfter -le $now) { throw "The configured Windows signing certificate is not currently valid." }
            $eku = $cert.Extensions | Where-Object { $_.Oid.Value -eq "2.5.29.37" } | Select-Object -First 1
            if (-not $eku -or $eku.Format($false) -notmatch "1.3.6.1.5.5.7.3.3") { throw "The configured certificate does not include the Code Signing EKU." }
            $expectedThumbprint = ($env:WINDOWS_SIGNING_CERT_THUMBPRINT -replace "[^0-9A-Fa-f]", "").ToUpperInvariant()
            if ($cert.Thumbprint.ToUpperInvariant() -ne $expectedThumbprint) { throw "The configured PFX thumbprint does not match WINDOWS_SIGNING_CERT_THUMBPRINT." }
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/signtool.exe" | Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
            if (-not $signtool) { throw "Windows SDK signtool.exe was not found." }
            & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfxPath /p $env:WINDOWS_SIGNING_PFX_PASSWORD release/CodeForge-Setup-Windows.exe
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed." }
            $signature = Get-AuthenticodeSignature release/CodeForge-Setup-Windows.exe
            if ($signature.Status -ne "Valid" -or -not $signature.SignerCertificate -or $signature.SignerCertificate.Thumbprint -ne $cert.Thumbprint) {
              throw "Authenticode verification failed: $($signature.Status)"
            }
            & $signtool.FullName verify /pa /all /v release/CodeForge-Setup-Windows.exe
            if ($LASTEXITCODE -ne 0) { throw "Windows Authenticode policy verification failed." }
            [IO.File]::WriteAllBytes(
              (Join-Path (Get-Location) "release/CodeForge-Windows-Certificate.cer"),
              $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert)
            )
            @(
              "SIGNING=durable",
              "SIGNATURE_STATUS=$($signature.Status)",
              "SUBJECT=$($cert.Subject)",
              "ISSUER=$($cert.Issuer)",
              "THUMBPRINT=$($cert.Thumbprint.ToUpperInvariant())",
              "NOT_BEFORE=$($cert.NotBefore.ToUniversalTime().ToString('o'))",
              "NOT_AFTER=$($cert.NotAfter.ToUniversalTime().ToString('o'))",
              "TIMESTAMP_URL=http://timestamp.digicert.com"
            ) | Set-Content -Path release/WINDOWS-SIGNING-METADATA.txt -Encoding utf8
          }
          finally {
            $cert.Dispose()
            Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
          }
      - name: Record Windows build metadata and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path release/WINDOWS-SIGNING-METADATA.txt)) {
            @("SIGNING=unsigned", "SIGNATURE_STATUS=not-signed") | Set-Content -Path release/WINDOWS-SIGNING-METADATA.txt -Encoding utf8
          }
          $hash = (Get-FileHash release/CodeForge-Setup-Windows.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  CodeForge-Setup-Windows.exe" | Set-Content -Path release/SHA256-Windows.txt -Encoding ascii -NoNewline
          $signing = Get-Content release/WINDOWS-SIGNING-METADATA.txt | Where-Object { $_ -like "SIGNING=*" } | Select-Object -First 1
          @(
            "COMMIT=$env:GITHUB_SHA",
            "WORKFLOW_RUN_ID=$env:GITHUB_RUN_ID",
            "RUN_NUMBER=$env:GITHUB_RUN_NUMBER",
            "VERSION=1.0.$env:GITHUB_RUN_NUMBER",
            $signing
          ) | Set-Content -Path release/BUILD-METADATA.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: codeforge-windows-installer
          path: release/*
          if-no-files-found: error
          retention-days: 30

  android:
    name: Build Android APK
    concurrency:
      group: codeforge-android-build-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - name: Detect durable Android signing configuration
        id: android-signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" || -z "$ANDROID_SIGNING_CERT_SHA256" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Android APK will remain unsigned; production release is blocked until the durable keystore, alias, passwords, and expected certificate fingerprint are configured."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Expo dependencies
        working-directory: apps/mobile
        run: npm install --include=optional --no-audit --no-fund --package-lock=false
      - name: Set monotonic Android app version
        working-directory: apps/mobile
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          node -e "const fs=require('node:fs');const p='app.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.expo.android.versionCode=Number(process.env.BUILD_NUMBER);j.expo.version='1.0.'+process.env.BUILD_NUMBER;fs.writeFileSync(p,JSON.stringify(j,null,2));"
      - name: Generate Android project
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: "1"
        run: npx expo prebuild --platform android --clean --no-install
      - name: Assemble release APK
        working-directory: apps/mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleRelease
      - name: Align APK and record package metadata
        shell: bash
        run: |
          set -euo pipefail
          SDK_BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          APK="$(find apps/mobile/android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          mkdir -p release
          "$SDK_BUILD_TOOLS/aapt" dump badging "$APK" > release/APK-METADATA.txt
          grep -q "^package: name='com.codeforge.ide'" release/APK-METADATA.txt
          "$SDK_BUILD_TOOLS/zipalign" -p -f 4 "$APK" "$RUNNER_TEMP/CodeForge-aligned.apk"
      - name: Sign APK with durable production keystore
        if: steps.android-signing.outputs.configured == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/codeforge-production-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null
          EXPECTED_CERT="$(printf '%s' "$ANDROID_SIGNING_CERT_SHA256" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          ACTUAL_KEYSTORE_CERT="$(keytool -exportcert -keystore "$KEYSTORE" -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" | sha256sum | awk '{print toupper($1)}')"
          test "$ACTUAL_KEYSTORE_CERT" = "$EXPECTED_CERT"
          SDK_BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$SDK_BUILD_TOOLS/apksigner" sign             --ks "$KEYSTORE"             --ks-key-alias "$ANDROID_KEY_ALIAS"             --ks-pass env:ANDROID_KEYSTORE_PASSWORD             --key-pass env:ANDROID_KEY_PASSWORD             --out release/CodeForge.apk "$RUNNER_TEMP/CodeForge-aligned.apk"
          "$SDK_BUILD_TOOLS/apksigner" verify --verbose --print-certs release/CodeForge.apk | tee release/ANDROID-SIGNING-VERIFICATION.txt
          ACTUAL_SIGNER_CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' release/ANDROID-SIGNING-VERIFICATION.txt | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]' | head -n 1)"
          test "$ACTUAL_SIGNER_CERT" = "$EXPECTED_CERT"
          printf 'SIGNING=durable\nCERT_SHA256=%s\nKEY_ALIAS=%s\n' "$ACTUAL_SIGNER_CERT" "$ANDROID_KEY_ALIAS" > release/ANDROID-SIGNING-METADATA.txt
          rm -f "$KEYSTORE"
      - name: Stage unsigned APK when durable signing is unavailable
        if: steps.android-signing.outputs.configured != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/CodeForge-aligned.apk" release/CodeForge.apk
          printf 'SIGNING=unsigned\nSIGNATURE_STATUS=not-signed\n' > release/ANDROID-SIGNING-METADATA.txt
      - name: Record Android build metadata and checksum
        shell: bash
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          (cd release && sha256sum CodeForge.apk > SHA256-Android.txt)
          SIGNING="$(sed -n 's/^SIGNING=//p' release/ANDROID-SIGNING-METADATA.txt | head -n 1)"
          CERT_SHA256="$(sed -n 's/^CERT_SHA256=//p' release/ANDROID-SIGNING-METADATA.txt | head -n 1)"
          {
            printf 'PACKAGE=com.codeforge.ide\n'
            printf 'VERSION=1.0.%s\n' "$BUILD_NUMBER"
            printf 'VERSION_CODE=%s\n' "$BUILD_NUMBER"
            printf 'COMMIT=%s\n' "$GITHUB_SHA"
            printf 'WORKFLOW_RUN_ID=%s\n' "$GITHUB_RUN_ID"
            printf 'RUN_NUMBER=%s\n' "$BUILD_NUMBER"
            printf 'SIGNING=%s\n' "$SIGNING"
            printf 'CERT_SHA256=%s\n' "$CERT_SHA256"
          } > release/BUILD-METADATA.txt
          rm -f "$RUNNER_TEMP/CodeForge-aligned.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: codeforge-android-apk
          path: release/*
          if-no-files-found: error
          retention-days: 30
