name: CodeForge production installers

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "apps/desktop/**"
      - "apps/mobile/**"
      - "apps/web/**"
      - ".github/workflows/production-installers.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codeforge-production-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build Windows desktop installer
    concurrency:
      group: codeforge-windows-build-${{ github.ref }}
      cancel-in-progress: true
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund
      - name: Generate platform icons
        working-directory: apps/desktop
        run: npx tauri icon src-tauri/icons/icon.png
      - name: Build Windows NSIS installer
        working-directory: apps/desktop
        run: npx tauri build --bundles nsis
      - name: Sign with a generated self-signed certificate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=CodeForge Local Release" -CertStoreLocation "Cert:\CurrentUser\My" -NotAfter (Get-Date).AddYears(3)
          $pfxPath = Join-Path $env:RUNNER_TEMP "codeforge-signing.pfx"
          $pfxPasswordText = [Guid]::NewGuid().ToString("N")
          $pfxPassword = ConvertTo-SecureString $pfxPasswordText -AsPlainText -Force
          Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $pfxPassword | Out-Null
          $installer = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $installer) { throw "Tauri did not produce a Windows NSIS installer." }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "Windows SDK signtool.exe was not found." }
          & $signtool.FullName sign /fd SHA256 /f $pfxPath /p $pfxPasswordText $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed." }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item $installer.FullName release/CodeForge-Setup-Windows.exe
          $certPath = Join-Path $env:RUNNER_TEMP "CodeForge-SelfSigned.cer"
          Export-Certificate -Cert $cert -FilePath $certPath | Out-Null
          Import-Certificate -FilePath $certPath -CertStoreLocation "Cert:\CurrentUser\Root" | Out-Null
          Import-Certificate -FilePath $certPath -CertStoreLocation "Cert:\CurrentUser\TrustedPublisher" | Out-Null
          Copy-Item $certPath release/CodeForge-SelfSigned.cer
          Get-FileHash release/CodeForge-Setup-Windows.exe -Algorithm SHA256 | Format-List | Out-File release/SHA256-Windows.txt
          $signature = Get-AuthenticodeSignature release/CodeForge-Setup-Windows.exe
          if (-not $signature.SignerCertificate -or $signature.SignerCertificate.Thumbprint -ne $cert.Thumbprint -or $signature.Status -ne "Valid") { throw "Signed installer verification failed: $($signature.Status)" }
          Remove-Item "Cert:\CurrentUser\Root\$($cert.Thumbprint)" -Force -ErrorAction SilentlyContinue
          Remove-Item "Cert:\CurrentUser\TrustedPublisher\$($cert.Thumbprint)" -Force -ErrorAction SilentlyContinue
          Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" -Force -ErrorAction SilentlyContinue
          Remove-Item $pfxPath -Force
      - uses: actions/upload-artifact@v4
        with:
          name: codeforge-windows-installer
          path: release/*
          if-no-files-found: error
          retention-days: 30

  android:
    name: Build signed Android APK
    concurrency:
      group: codeforge-android-build-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - name: Generate one-build Android signing identity
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/codeforge-release.jks" -storepass "codeforge-build-only" -keypass "codeforge-build-only" -alias codeforge -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=CodeForge Build,O=CodeForge,C=IN"
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/codeforge-release.jks" >> "$GITHUB_ENV"
      - name: Install Expo dependencies
        working-directory: apps/mobile
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Set monotonic Android app version
        working-directory: apps/mobile
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          node -e "const fs=require('node:fs');const p='app.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.expo.android.versionCode=Number(process.env.BUILD_NUMBER);j.expo.version='1.0.'+process.env.BUILD_NUMBER;fs.writeFileSync(p,JSON.stringify(j,null,2));"
      - name: Generate Android project
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: "1"
        run: npx expo prebuild --platform android --clean --no-install
      - name: Assemble release APK
        working-directory: apps/mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleRelease
      - name: Align, sign, and verify APK
        shell: bash
        run: |
          set -euo pipefail
          SDK_BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          APK="$(find apps/mobile/android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          mkdir -p release
          "$SDK_BUILD_TOOLS/zipalign" -p -f 4 "$APK" "$RUNNER_TEMP/CodeForge-aligned.apk"
          "$SDK_BUILD_TOOLS/apksigner" sign \
            --ks "$ANDROID_KEYSTORE" \
            --ks-key-alias codeforge \
            --ks-pass pass:codeforge-build-only \
            --key-pass pass:codeforge-build-only \
            --out release/CodeForge.apk "$RUNNER_TEMP/CodeForge-aligned.apk"
          "$SDK_BUILD_TOOLS/apksigner" verify --verbose --print-certs release/CodeForge.apk
          sha256sum release/CodeForge.apk > release/SHA256-Android.txt
          printf 'PACKAGE=com.codeforge.ide\n' > release/BUILD-METADATA.txt
          printf 'VERSION=1.0.%s\n' "$GITHUB_RUN_NUMBER" >> release/BUILD-METADATA.txt
          printf 'SIGNING=one-build generated key; signature verified; future upgrades require uninstall/reinstall\n' >> release/BUILD-METADATA.txt
          rm -f "$ANDROID_KEYSTORE" "$RUNNER_TEMP/CodeForge-aligned.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: codeforge-android-apk
          path: release/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish versioned downloads
    concurrency:
      group: codeforge-latest-release-publish
      cancel-in-progress: true
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: codeforge-windows-installer
          path: release/windows
      - uses: actions/download-artifact@v4
        with:
          name: codeforge-android-apk
          path: release/android
      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          target_commitish: ${{ github.sha }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('CodeForge {0}', github.ref_name) || 'CodeForge Latest' }}
          make_latest: true
          generate_release_notes: true
          files: |
            release/windows/CodeForge-Setup-Windows.exe
            release/windows/CodeForge-SelfSigned.cer
            release/windows/SHA256-Windows.txt
            release/android/CodeForge.apk
            release/android/SHA256-Android.txt
            release/android/BUILD-METADATA.txt
