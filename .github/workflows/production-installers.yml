name: CodeForge production installers

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "apps/desktop/**"
      - "apps/mobile/**"
      - ".github/workflows/production-installers.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codeforge-production-installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build Windows desktop installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund
      - name: Generate platform icons
        working-directory: apps/desktop
        run: npx tauri icon src-tauri/icons/icon.png
      - name: Build Windows NSIS installer
        working-directory: apps/desktop
        run: npx tauri build --bundles nsis
      - name: Stage installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $installer = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $installer) { throw "Tauri did not produce a Windows NSIS installer." }
          Copy-Item $installer.FullName release/CodeForge-Setup-Windows.exe
          Get-FileHash release/CodeForge-Setup-Windows.exe -Algorithm SHA256 | Format-List | Out-File release/SHA256-Windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: codeforge-windows-installer
          path: release/*
          if-no-files-found: error
          retention-days: 30

  android:
    name: Build signed Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - name: Require persistent Android release signing identity
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::Missing ANDROID_KEYSTORE_BASE64 repository secret."; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "::error::Missing ANDROID_KEYSTORE_PASSWORD repository secret."; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "::error::Missing ANDROID_KEY_ALIAS repository secret."; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "::error::Missing ANDROID_KEY_PASSWORD repository secret."; exit 1; }
      - name: Install Expo dependencies
        working-directory: apps/mobile
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Generate Android project
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: "1"
        run: npx expo prebuild --platform android --clean --no-install
      - name: Assemble release APK
        working-directory: apps/mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleRelease
      - name: Align, sign, and verify APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          SDK_BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          APK="$(find apps/mobile/android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          mkdir -p release
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/codeforge-release.jks"
          "$SDK_BUILD_TOOLS/zipalign" -p -f 4 "$APK" "$RUNNER_TEMP/CodeForge-aligned.apk"
          export KEYSTORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
          export KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
          "$SDK_BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/codeforge-release.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out release/CodeForge.apk "$RUNNER_TEMP/CodeForge-aligned.apk"
          "$SDK_BUILD_TOOLS/apksigner" verify --verbose --print-certs release/CodeForge.apk
          sha256sum release/CodeForge.apk > release/SHA256-Android.txt
          printf 'PACKAGE=com.codeforge.ide\n' > release/BUILD-METADATA.txt
          printf 'VERSION=1.0.0\n' >> release/BUILD-METADATA.txt
          printf 'SIGNING=persistent release keystore; signature verified\n' >> release/BUILD-METADATA.txt
          rm -f "$RUNNER_TEMP/codeforge-release.jks" "$RUNNER_TEMP/CodeForge-aligned.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: codeforge-android-apk
          path: release/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish versioned downloads
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: codeforge-windows-installer
          path: release/windows
      - uses: actions/download-artifact@v4
        with:
          name: codeforge-android-apk
          path: release/android
      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/windows/CodeForge-Setup-Windows.exe
            release/windows/SHA256-Windows.txt
            release/android/CodeForge.apk
            release/android/SHA256-Android.txt
            release/android/BUILD-METADATA.txt
