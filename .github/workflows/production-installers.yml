name: CodeForge production installers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: codeforge-production-installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build Windows desktop installer
    concurrency:
      group: codeforge-windows-build-${{ github.ref }}
      cancel-in-progress: false
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact source revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund
      - name: Generate platform icons
        working-directory: apps/desktop
        run: npx tauri icon src-tauri/icons/icon.png
      - name: Build Windows NSIS installer
        working-directory: apps/desktop
        run: npx tauri build --bundles nsis
      - name: Stage Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe | Sort-Object FullName | Select-Object -First 1
          if (-not $installer) { throw "Tauri did not produce a Windows NSIS installer." }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item $installer.FullName release/CodeForge-Setup-Windows.exe
      - name: Detect SignPath Foundation signing configuration
        id: windows-signing
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          WINDOWS_SIGNING_CERT_THUMBPRINT: ${{ vars.WINDOWS_SIGNING_CERT_THUMBPRINT }}
        run: |
          $required = @(
            [pscustomobject]@{ Name = 'SIGNPATH_API_TOKEN'; Value = $env:SIGNPATH_API_TOKEN },
            [pscustomobject]@{ Name = 'SIGNPATH_ORGANIZATION_ID'; Value = $env:SIGNPATH_ORGANIZATION_ID },
            [pscustomobject]@{ Name = 'SIGNPATH_PROJECT_SLUG'; Value = $env:SIGNPATH_PROJECT_SLUG },
            [pscustomobject]@{ Name = 'SIGNPATH_SIGNING_POLICY_SLUG'; Value = $env:SIGNPATH_SIGNING_POLICY_SLUG },
            [pscustomobject]@{ Name = 'SIGNPATH_ARTIFACT_CONFIGURATION_SLUG'; Value = $env:SIGNPATH_ARTIFACT_CONFIGURATION_SLUG },
            [pscustomobject]@{ Name = 'WINDOWS_SIGNING_CERT_THUMBPRINT'; Value = $env:WINDOWS_SIGNING_CERT_THUMBPRINT }
          )
          $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace($_.Value) } | ForEach-Object { $_.Name })
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            $missing += 'main-branch-only-signing'
          }
          if ($missing.Count -gt 0) {
            "configured=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "::notice::Windows installer will remain unsigned; SignPath signing is unavailable or not permitted for this ref. Missing: $($missing -join ', ')"
          } else {
            "configured=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
      - name: Upload unsigned installer to GitHub for SignPath
        id: upload-unsigned-windows-installer
        if: steps.windows-signing.outputs.configured == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          path: release/CodeForge-Setup-Windows.exe
          archive: false
          if-no-files-found: error
          retention-days: 1
      # Pin the official SignPath action to the immutable v3 commit.
      - name: Submit Windows installer to SignPath Foundation
        id: signpath-windows-signing
        if: steps.windows-signing.outputs.configured == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-windows-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          skip-decompress: true
          output-artifact-directory: release/signpath-signed
      - name: Verify and stage SignPath-signed Windows installer
        if: steps.windows-signing.outputs.configured == 'true'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_THUMBPRINT: ${{ vars.WINDOWS_SIGNING_CERT_THUMBPRINT }}
          SIGNPATH_SIGNING_REQUEST_ID: ${{ steps.signpath-windows-signing.outputs.signing-request-id }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_SIGNING_REQUEST_ID)) {
            throw "SignPath did not return a signing request ID."
          }
          $signedCandidates = @(Get-ChildItem release/signpath-signed -Filter "CodeForge-Setup-Windows.exe" -File -Recurse)
          if ($signedCandidates.Count -ne 1) {
            throw "Expected exactly one signed CodeForge-Setup-Windows.exe from SignPath; found $($signedCandidates.Count)."
          }
          Copy-Item $signedCandidates[0].FullName release/CodeForge-Setup-Windows.exe -Force
          $signature = Get-AuthenticodeSignature release/CodeForge-Setup-Windows.exe
          if ($signature.Status -ne "Valid" -or -not $signature.SignerCertificate) {
            throw "SignPath Authenticode verification failed: $($signature.Status)"
          }
          $expectedThumbprint = ($env:WINDOWS_SIGNING_CERT_THUMBPRINT -replace "[^0-9A-Fa-f]", "").ToUpperInvariant()
          $actualThumbprint = $signature.SignerCertificate.Thumbprint.ToUpperInvariant()
          if ($actualThumbprint -ne $expectedThumbprint) {
            throw "The SignPath signer certificate does not match WINDOWS_SIGNING_CERT_THUMBPRINT."
          }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw "Windows SDK signtool.exe was not found." }
          & $signtool.FullName verify /pa /all /v release/CodeForge-Setup-Windows.exe
          if ($LASTEXITCODE -ne 0) { throw "Windows Authenticode policy verification failed." }
          $certificatePath = Join-Path (Get-Location) "release/CodeForge-Windows-Certificate.cer"
          Export-Certificate -Cert $signature.SignerCertificate -FilePath $certificatePath -Type CERT -Force | Out-Null
          $certificateFileHash = (Get-FileHash $certificatePath -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "SIGNING=durable",
            "SIGNATURE_STATUS=$($signature.Status)",
            "SIGNING_PROVIDER=SignPath Foundation",
            "SIGNPATH_SIGNING_REQUEST_ID=$env:SIGNPATH_SIGNING_REQUEST_ID",
            "SUBJECT=$($signature.SignerCertificate.Subject)",
            "ISSUER=$($signature.SignerCertificate.Issuer)",
            "THUMBPRINT=$actualThumbprint",
            "CERT_FILE_SHA256=$certificateFileHash",
            "NOT_BEFORE=$($signature.SignerCertificate.NotBefore.ToUniversalTime().ToString('o'))",
            "NOT_AFTER=$($signature.SignerCertificate.NotAfter.ToUniversalTime().ToString('o'))"
          ) | Set-Content -Path release/WINDOWS-SIGNING-METADATA.txt -Encoding utf8
      - name: Create a self-signed Windows code-signing certificate
        if: steps.windows-signing.outputs.configured != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=CodeForge Preview Publisher" -FriendlyName "CodeForge Preview Publisher" -CertStoreLocation "Cert:\CurrentUser\My" -KeyAlgorithm RSA -KeyLength 3072 -HashAlgorithm SHA256 -KeyUsage DigitalSignature -NotAfter (Get-Date).AddYears(5)
          if (-not $cert -or -not $cert.HasPrivateKey) { throw "Windows could not create a private CodeForge code-signing certificate." }
          $pfxPath = Join-Path $env:RUNNER_TEMP "codeforge-preview-signing.pfx"
          $cerPath = Join-Path (Get-Location) "release/CodeForge-Windows-Certificate.cer"
          $randomBytes = New-Object byte[] 32
          [System.Security.Cryptography.RandomNumberGenerator]::Fill($randomBytes)
          $pfxPasswordPlain = [Convert]::ToBase64String($randomBytes)
          $pfxPasswordSecure = ConvertTo-SecureString $pfxPasswordPlain -AsPlainText -Force
          try {
            Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $pfxPasswordSecure -Force | Out-Null
            Export-Certificate -Cert $cert -FilePath $cerPath -Type CERT -Force | Out-Null
            Import-Certificate -FilePath $cerPath -CertStoreLocation "Cert:\CurrentUser\Root" | Out-Null
            Import-Certificate -FilePath $cerPath -CertStoreLocation "Cert:\CurrentUser\TrustedPublisher" | Out-Null
            $signtool = Get-ChildItem "\${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/signtool.exe" -ErrorAction SilentlyContinue |
              Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
              Select-Object -First 1
            if (-not $signtool) { throw "Windows SDK signtool.exe was not found." }
            & $signtool.FullName sign /fd SHA256 /f $pfxPath /p $pfxPasswordPlain /v release/CodeForge-Setup-Windows.exe
            if ($LASTEXITCODE -ne 0) { throw "signtool failed to sign the Windows installer." }
            & $signtool.FullName verify /pa /all /v release/CodeForge-Setup-Windows.exe
            if ($LASTEXITCODE -ne 0) { throw "Windows Authenticode verification failed for the self-signed installer." }
            $signature = Get-AuthenticodeSignature release/CodeForge-Setup-Windows.exe
            if ($signature.Status -ne "Valid" -or -not $signature.SignerCertificate) {
              throw "Windows did not validate the self-signed Authenticode signature: $($signature.Status)"
            }
            $actualThumbprint = $signature.SignerCertificate.Thumbprint.ToUpperInvariant()
            if ($actualThumbprint -ne $cert.Thumbprint.ToUpperInvariant()) { throw "The Authenticode certificate does not match the generated publisher identity." }
            $certificateFileHash = (Get-FileHash $cerPath -Algorithm SHA256).Hash.ToLowerInvariant()
            @(
              "SIGNING=self-signed",
              "SIGNATURE_STATUS=Valid",
              "SIGNING_PROVIDER=CodeForge self-signed preview certificate",
              "SUBJECT=$($signature.SignerCertificate.Subject)",
              "ISSUER=$($signature.SignerCertificate.Issuer)",
              "THUMBPRINT=$actualThumbprint",
              "CERT_FILE_SHA256=$certificateFileHash",
              "NOT_BEFORE=$($signature.SignerCertificate.NotBefore.ToUniversalTime().ToString('o'))",
              "NOT_AFTER=$($signature.SignerCertificate.NotAfter.ToUniversalTime().ToString('o'))"
            ) | Set-Content -Path release/WINDOWS-SIGNING-METADATA.txt -Encoding utf8
          }
          finally {
            Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
            [Array]::Clear($randomBytes, 0, $randomBytes.Length)
            $pfxPasswordPlain = $null
            $pfxPasswordSecure = $null
          }
      - name: Record Windows build metadata and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path release/WINDOWS-SIGNING-METADATA.txt)) {
            throw "A signed Windows installer and signing metadata are required; unsigned fallback is disabled."
          }
          $signingMetadata = Get-Content release/WINDOWS-SIGNING-METADATA.txt
          $signing = $signingMetadata | Where-Object { $_ -like "SIGNING=*" } | Select-Object -First 1
          if ($signing -notin @("SIGNING=durable", "SIGNING=self-signed")) { throw "Unsupported Windows signing state: $signing" }
          if (-not (Test-Path release/CodeForge-Windows-Certificate.cer)) { throw "A public Windows signing certificate is required." }
          $signature = Get-AuthenticodeSignature release/CodeForge-Setup-Windows.exe
          if ($signature.Status -ne "Valid" -or -not $signature.SignerCertificate) { throw "Windows Authenticode signature verification failed: $($signature.Status)" }
          $expectedThumbprint = (($signingMetadata | Where-Object { $_ -like "THUMBPRINT=*" } | Select-Object -First 1) -replace "^THUMBPRINT=", "").ToUpperInvariant()
          $actualThumbprint = $signature.SignerCertificate.Thumbprint.ToUpperInvariant()
          if (-not $expectedThumbprint -or $actualThumbprint -ne $expectedThumbprint) { throw "Windows signer thumbprint does not match the signing metadata." }
          $expectedCertificateHash = (($signingMetadata | Where-Object { $_ -like "CERT_FILE_SHA256=*" } | Select-Object -First 1) -replace "^CERT_FILE_SHA256=", "").ToLowerInvariant()
          $actualCertificateHash = (Get-FileHash release/CodeForge-Windows-Certificate.cer -Algorithm SHA256).Hash.ToLowerInvariant()
          if (-not $expectedCertificateHash -or $actualCertificateHash -ne $expectedCertificateHash) { throw "The public certificate does not match its signing metadata." }
          $hash = (Get-FileHash release/CodeForge-Setup-Windows.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  CodeForge-Setup-Windows.exe" | Set-Content -Path release/SHA256-Windows.txt -Encoding ascii -NoNewline
          @(
            "COMMIT=$env:GITHUB_SHA",
            "WORKFLOW_RUN_ID=$env:GITHUB_RUN_ID",
            "RUN_NUMBER=$env:GITHUB_RUN_NUMBER",
            "VERSION=1.0.$env:GITHUB_RUN_NUMBER",
            $signing,
            "SIGNATURE_STATUS=Valid",
            "THUMBPRINT=$actualThumbprint",
            "CERT_FILE_SHA256=$actualCertificateHash",
            "SHA256=$hash"
          ) | Set-Content -Path release/BUILD-METADATA.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: codeforge-windows-installer
          path: release/*
          if-no-files-found: error
          retention-days: 30

  android:
    name: Build Android APK
    concurrency:
      group: codeforge-android-build-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - name: Require durable Android production signing configuration
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$ANDROID_KEYSTORE_BASE64" ]] || missing+=("ANDROID_KEYSTORE_BASE64")
          [[ -n "$ANDROID_KEYSTORE_PASSWORD" ]] || missing+=("ANDROID_KEYSTORE_PASSWORD")
          [[ -n "$ANDROID_KEY_ALIAS" ]] || missing+=("ANDROID_KEY_ALIAS")
          [[ -n "$ANDROID_KEY_PASSWORD" ]] || missing+=("ANDROID_KEY_PASSWORD")
          [[ -n "$ANDROID_SIGNING_CERT_SHA256" ]] || missing+=("ANDROID_SIGNING_CERT_SHA256")
          if (("${#missing[@]}" > 0)); then
            echo "::error::The Android production signing secrets are required. Missing names: ${missing[*]}. No credential values were printed."
            exit 1
          fi
          EXPECTED_CERT="$(printf '%s' "$ANDROID_SIGNING_CERT_SHA256" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          if [[ ! "$EXPECTED_CERT" =~ ^[A-F0-9]{64}$ ]]; then
            echo "::error::ANDROID_SIGNING_CERT_SHA256 must be a 64-character SHA-256 certificate fingerprint."
            exit 1
          fi
          echo "All Android production signing inputs are present; values remain masked."
      - name: Install Expo dependencies
        working-directory: apps/mobile
        run: npm install --include=optional --no-audit --no-fund --package-lock=false
      - name: Set monotonic Android app version
        working-directory: apps/mobile
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          node -e "const fs=require('node:fs');const p='app.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.expo.android.versionCode=Number(process.env.BUILD_NUMBER);j.expo.version='1.0.'+process.env.BUILD_NUMBER;fs.writeFileSync(p,JSON.stringify(j,null,2));"
      - name: Generate Android project
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: "1"
        run: npx expo prebuild --platform android --clean --no-install
      - name: Assemble release APK
        working-directory: apps/mobile/android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          for attempt in 1 2 3; do
            echo "Gradle production build attempt $attempt/3"
            if ./gradlew --no-daemon --stacktrace --refresh-dependencies :app:assembleRelease; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Android production build failed after three logged attempts."
              exit 1
            fi
            sleep "$((attempt * 10))"
          done
      - name: Align APK and record package metadata
        shell: bash
        run: |
          set -euo pipefail
          SDK_BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          APK="$(find apps/mobile/android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          mkdir -p release
          "$SDK_BUILD_TOOLS/aapt" dump badging "$APK" > release/APK-METADATA.txt
          grep -q "^package: name='com.codeforge.ide'" release/APK-METADATA.txt
          "$SDK_BUILD_TOOLS/zipalign" -p -f 4 "$APK" "$RUNNER_TEMP/CodeForge-aligned.apk"
      - name: Verify Android permission allowlist
        run: node scripts/verify-android-permissions.mjs release/APK-METADATA.txt
      - name: Sign Android APK with the durable production keystore
        id: android-signing-run
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: \${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: \${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: \${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: \${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: \${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/codeforge-production-release"
          KEYSTORE_LIST="$RUNNER_TEMP/codeforge-keystore-list.txt"
          KEYTOOL_STDOUT="$RUNNER_TEMP/codeforge-keytool-stdout.txt"
          KEYTOOL_STDERR="$RUNNER_TEMP/codeforge-keytool-stderr.txt"
          CERTIFICATE="$RUNNER_TEMP/codeforge-signer.cer"
          trap 'rm -f "$KEYSTORE" "$KEYSTORE_LIST" "$KEYTOOL_STDOUT" "$KEYTOOL_STDERR" "$CERTIFICATE" "$RUNNER_TEMP/CodeForge-aligned.apk"' EXIT
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64-encoded keystore data."
            exit 1
          fi
          if [[ ! -s "$KEYSTORE" ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 decoded to an empty file."
            exit 1
          fi
          echo "Decoded Android keystore size: $(wc -c < "$KEYSTORE" | tr -d '[:space:]') bytes."
          KEYSTORE_TYPE=""
          for candidate_type in JKS PKCS12; do
            : > "$KEYTOOL_STDOUT"
            : > "$KEYTOOL_STDERR"
            if keytool -list -v -keystore "$KEYSTORE" -storetype "$candidate_type" -storepass "$ANDROID_KEYSTORE_PASSWORD" > "$KEYTOOL_STDOUT" 2> "$KEYTOOL_STDERR"; then
              KEYSTORE_TYPE="$candidate_type"
              cp "$KEYTOOL_STDOUT" "$KEYSTORE_LIST"
              break
            fi
          done
          if [[ -z "$KEYSTORE_TYPE" ]]; then
            SAFE_DIAGNOSTIC="$(grep -hiE 'keytool error:|java\.io\.|keystore password|unrecoverable|invalid keystore|not a valid' "$KEYTOOL_STDOUT" "$KEYTOOL_STDERR" | head -n 1 | cut -c1-240 || true)"
            echo "::error::The Android keystore could not be opened as JKS or PKCS12. Verify the Base64 file and matching store password. Safe diagnostic: \${SAFE_DIAGNOSTIC:-no non-sensitive diagnostic was returned}."
            exit 1
          fi
          echo "Android keystore opened successfully as $KEYSTORE_TYPE."
          if ! awk -F, -v alias="$ANDROID_KEY_ALIAS" '$1 == alias { found=1 } END { exit !found }' "$KEYSTORE_LIST"; then
            echo "::error::The Android keystore opened, but the configured key alias was not found. Verify ANDROID_KEY_ALIAS in repository secrets."
            exit 1
          fi
          echo "Configured Android key alias is present."
          EXPECTED_CERT="$(printf '%s' "$ANDROID_SIGNING_CERT_SHA256" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          if [[ ! "$EXPECTED_CERT" =~ ^[A-F0-9]{64}$ ]]; then
            echo "::error::ANDROID_SIGNING_CERT_SHA256 must be a 64-character SHA-256 certificate fingerprint."
            exit 1
          fi
          keytool -exportcert -keystore "$KEYSTORE" -storetype "$KEYSTORE_TYPE" -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" > "$CERTIFICATE"
          ACTUAL_KEYSTORE_CERT="$(sha256sum "$CERTIFICATE" | awk '{print toupper($1)}')"
          echo "Android keystore certificate SHA-256: $ACTUAL_KEYSTORE_CERT"
          if [[ "$ACTUAL_KEYSTORE_CERT" != "$EXPECTED_CERT" ]]; then
            echo "::error::The certificate inside ANDROID_KEYSTORE_BASE64 does not match ANDROID_SIGNING_CERT_SHA256. No APK will be published."
            exit 1
          fi
          SDK_BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$SDK_BUILD_TOOLS/apksigner" sign --verbose \
            --ks "$KEYSTORE" \
            --ks-type "$KEYSTORE_TYPE" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out release/CodeForge.apk "$RUNNER_TEMP/CodeForge-aligned.apk"
          "$SDK_BUILD_TOOLS/apksigner" verify --verbose --Werr --print-certs release/CodeForge.apk | tee release/ANDROID-SIGNING-VERIFICATION.txt
          ACTUAL_SIGNER_CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' release/ANDROID-SIGNING-VERIFICATION.txt | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]' | head -n 1)"
          if [[ -z "$ACTUAL_SIGNER_CERT" || "$ACTUAL_SIGNER_CERT" != "$EXPECTED_CERT" ]]; then
            echo "::error::The APK signature is invalid or its signer does not match the durable production certificate."
            exit 1
          fi
          "$SDK_BUILD_TOOLS/zipalign" -c 4 release/CodeForge.apk
          "$SDK_BUILD_TOOLS/aapt" dump badging release/CodeForge.apk > release/APK-METADATA.txt
          grep -q "^package: name='com.codeforge.ide'" release/APK-METADATA.txt
          printf 'SIGNING=durable\nCERT_SHA256=%s\nKEY_ALIAS=%s\nKEYSTORE_TYPE=%s\n' "$ACTUAL_SIGNER_CERT" "$ANDROID_KEY_ALIAS" "$KEYSTORE_TYPE" > release/ANDROID-SIGNING-METADATA.txt
      - name: Record signed Android build metadata and checksum
        shell: bash
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          test -s release/CodeForge.apk
          grep -Fx "SIGNING=durable" release/ANDROID-SIGNING-METADATA.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --Werr release/CodeForge.apk
          (cd release && sha256sum CodeForge.apk > SHA256-Android.txt)
          SIGNING="$(sed -n 's/^SIGNING=//p' release/ANDROID-SIGNING-METADATA.txt | head -n 1)"
          CERT_SHA256="$(sed -n 's/^CERT_SHA256=//p' release/ANDROID-SIGNING-METADATA.txt | head -n 1)"
          {
            printf 'PACKAGE=com.codeforge.ide\n'
