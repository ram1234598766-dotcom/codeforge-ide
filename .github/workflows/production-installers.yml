name: CodeForge production installers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: codeforge-production-installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build Windows desktop installer
    concurrency:
      group: codeforge-windows-build-${{ github.ref }}
      cancel-in-progress: false
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Verify exact source revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund
      - name: Generate platform icons
        working-directory: apps/desktop
        run: npx tauri icon src-tauri/icons/icon.png
      - name: Build Windows NSIS installer
        working-directory: apps/desktop
        run: npx tauri build --bundles nsis
      - name: Stage Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe | Sort-Object FullName | Select-Object -First 1
          if (-not $installer) { throw "Tauri did not produce a Windows NSIS installer." }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item $installer.FullName release/CodeForge-Setup-Windows.exe
      - name: Detect SignPath Foundation signing configuration
        id: windows-signing
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          WINDOWS_SIGNING_CERT_THUMBPRINT: ${{ vars.WINDOWS_SIGNING_CERT_THUMBPRINT }}
        run: |
          $required = @(
            [pscustomobject]@{ Name = 'SIGNPATH_API_TOKEN'; Value = $env:SIGNPATH_API_TOKEN },
            [pscustomobject]@{ Name = 'SIGNPATH_ORGANIZATION_ID'; Value = $env:SIGNPATH_ORGANIZATION_ID },
            [pscustomobject]@{ Name = 'SIGNPATH_PROJECT_SLUG'; Value = $env:SIGNPATH_PROJECT_SLUG },
            [pscustomobject]@{ Name = 'SIGNPATH_SIGNING_POLICY_SLUG'; Value = $env:SIGNPATH_SIGNING_POLICY_SLUG },
            [pscustomobject]@{ Name = 'SIGNPATH_ARTIFACT_CONFIGURATION_SLUG'; Value = $env:SIGNPATH_ARTIFACT_CONFIGURATION_SLUG },
            [pscustomobject]@{ Name = 'WINDOWS_SIGNING_CERT_THUMBPRINT'; Value = $env:WINDOWS_SIGNING_CERT_THUMBPRINT }
          )
          $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace($_.Value) } | ForEach-Object { $_.Name })
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            $missing += 'main-branch-only-signing'
          }
          if ($missing.Count -gt 0) {
            Write-Host "::error::Windows production signing requires an approved SignPath project, trusted release policy, and all required GitHub secrets/variables. Missing: $($missing -join ', ')"
            throw "Refusing to build or stage a Windows production installer without durable SignPath signing."
          }
          "configured=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Upload unsigned installer to GitHub for SignPath
        id: upload-unsigned-windows-installer
        if: steps.windows-signing.outputs.configured == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: NOT-PRODUCTION-ELIGIBLE-DIAGNOSTIC-Windows-SignPath-Input
          path: release/CodeForge-Setup-Windows.exe
          archive: false
          if-no-files-found: error
          retention-days: 1
      # Pin the official SignPath action to the immutable v3 commit.
      - name: Submit Windows installer to SignPath Foundation
        id: signpath-windows-signing
        if: steps.windows-signing.outputs.configured == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-windows-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          skip-decompress: true
          output-artifact-directory: release/signpath-signed
      - name: Verify and stage SignPath-signed Windows installer
        if: steps.windows-signing.outputs.configured == 'true'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_THUMBPRINT: ${{ vars.WINDOWS_SIGNING_CERT_THUMBPRINT }}
          SIGNPATH_SIGNING_REQUEST_ID: ${{ steps.signpath-windows-signing.outputs.signing-request-id }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_SIGNING_REQUEST_ID)) {
            throw "SignPath did not return a signing request ID."
          }
          $signedCandidates = @(Get-ChildItem release/signpath-signed -Filter "CodeForge-Setup-Windows.exe" -File -Recurse)
          if ($signedCandidates.Count -ne 1) {
            throw "Expected exactly one signed CodeForge-Setup-Windows.exe from SignPath; found $($signedCandidates.Count)."
          }
          Copy-Item $signedCandidates[0].FullName release/CodeForge-Setup-Windows.exe -Force
          $signature = Get-AuthenticodeSignature release/CodeForge-Setup-Windows.exe
          if ($signature.Status -ne "Valid" -or -not $signature.SignerCertificate) {
            throw "SignPath Authenticode verification failed: $($signature.Status)"
          }
          if (-not $signature.TimeStamperCertificate) {
            throw "The Windows Authenticode signature is missing a trusted timestamp."
          }
          $expectedThumbprint = ($env:WINDOWS_SIGNING_CERT_THUMBPRINT -replace "[^0-9A-Fa-f]", "").ToUpperInvariant()
          $actualThumbprint = $signature.SignerCertificate.Thumbprint.ToUpperInvariant()
          if ($actualThumbprint -ne $expectedThumbprint) {
            throw "The SignPath signer certificate does not match WINDOWS_SIGNING_CERT_THUMBPRINT."
          }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw "Windows SDK signtool.exe was not found." }
          & $signtool.FullName verify /pa /all /v release/CodeForge-Setup-Windows.exe
          if ($LASTEXITCODE -ne 0) { throw "Windows Authenticode policy verification failed." }
          $certificatePath = Join-Path (Get-Location) "release/CodeForge-Windows-Certificate.cer"
          Export-Certificate -Cert $signature.SignerCertificate -FilePath $certificatePath -Type CERT -Force | Out-Null
          $certificateFileHash = (Get-FileHash $certificatePath -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "SIGNING=durable",
            "SIGNATURE_STATUS=$($signature.Status)",
            "SIGNING_PROVIDER=SignPath Foundation",
            "SIGNPATH_SIGNING_REQUEST_ID=$env:SIGNPATH_SIGNING_REQUEST_ID",
            "SUBJECT=$($signature.SignerCertificate.Subject)",
            "ISSUER=$($signature.SignerCertificate.Issuer)",
            "TIMESTAMP_CERT_SUBJECT=$($signature.TimeStamperCertificate.Subject)",
            "TIMESTAMP_CERT_ISSUER=$($signature.TimeStamperCertificate.Issuer)",
            "TIMESTAMP_CERT_THUMBPRINT=$($signature.TimeStamperCertificate.Thumbprint.ToUpperInvariant())",
            "THUMBPRINT=$actualThumbprint",
            "CERT_FILE_SHA256=$certificateFileHash",
            "NOT_BEFORE=$($signature.SignerCertificate.NotBefore.ToUniversalTime().ToString('o'))",
            "NOT_AFTER=$($signature.SignerCertificate.NotAfter.ToUniversalTime().ToString('o'))"
          ) | Set-Content -Path release/WINDOWS-SIGNING-METADATA.txt -Encoding utf8
      - name: Record Windows build metadata and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path release/WINDOWS-SIGNING-METADATA.txt)) {
            throw "A signed Windows installer is required; unsigned production artifacts are not uploaded."
          }
          $signature = Get-AuthenticodeSignature release/CodeForge-Setup-Windows.exe
          if ($signature.Status -ne "Valid" -or -not $signature.SignerCertificate) {
            throw "Windows Authenticode verification failed: $($signature.Status)"
          }
          if (-not $signature.TimeStamperCertificate) {
            throw "Windows Authenticode timestamp verification failed: no timestamp certificate was present."
          }
          $signing = Get-Content release/WINDOWS-SIGNING-METADATA.txt | Where-Object { $_ -like "SIGNING=*" } | Select-Object -First 1
          if ($signing -ne "SIGNING=durable") {
            throw "A durable, publicly trusted SignPath-signed Windows installer is required; preview/self-signed output is not a production release."
          }
          $signingProvider = Get-Content release/WINDOWS-SIGNING-METADATA.txt | Where-Object { $_ -like "SIGNING_PROVIDER=*" } | Select-Object -First 1
          $signatureStatus = Get-Content release/WINDOWS-SIGNING-METADATA.txt | Where-Object { $_ -like "SIGNATURE_STATUS=*" } | Select-Object -First 1
          if ($signingProvider -ne "SIGNING_PROVIDER=SignPath Foundation" -or $signatureStatus -ne "SIGNATURE_STATUS=Valid") {
            throw "Windows signing provider or Authenticode verification state is not approved for production."
          }
          if (-not (Test-Path release/CodeForge-Windows-Certificate.cer)) {
            throw "The public SignPath signer certificate is missing from the production artifact."
          }
          $hash = (Get-FileHash release/CodeForge-Setup-Windows.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  CodeForge-Setup-Windows.exe" | Set-Content -Path release/SHA256-Windows.txt -Encoding ascii -NoNewline
          @(
            "COMMIT=$env:GITHUB_SHA",
            "WORKFLOW_RUN_ID=$env:GITHUB_RUN_ID",
            "RUN_NUMBER=$env:GITHUB_RUN_NUMBER",
            "VERSION=1.0.$env:GITHUB_RUN_NUMBER",
            $signing
          ) | Set-Content -Path release/BUILD-METADATA.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: codeforge-windows-installer
          path: |
            release/CodeForge-Setup-Windows.exe
            release/CodeForge-Windows-Certificate.cer
            release/WINDOWS-SIGNING-METADATA.txt
            release/BUILD-METADATA.txt
            release/SHA256-Windows.txt
          if-no-files-found: error
          retention-days: 30

  android:
    name: Build Android APK
    concurrency:
      group: codeforge-android-build-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - name: Detect durable Android signing configuration
        id: android-signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$ANDROID_KEYSTORE_BASE64" ]] || missing+=("ANDROID_KEYSTORE_BASE64 secret")
          [[ -n "$ANDROID_KEYSTORE_PASSWORD" ]] || missing+=("ANDROID_KEYSTORE_PASSWORD secret")
          [[ -n "$ANDROID_KEY_ALIAS" ]] || missing+=("ANDROID_KEY_ALIAS secret")
          [[ -n "$ANDROID_KEY_PASSWORD" ]] || missing+=("ANDROID_KEY_PASSWORD secret")
          [[ -n "$ANDROID_SIGNING_CERT_SHA256" ]] || missing+=("ANDROID_SIGNING_CERT_SHA256 repository variable")
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" || -z "$ANDROID_SIGNING_CERT_SHA256" ]]; then
            echo "::error::The Android production signing secrets are required. One or more expected secret names or the signing fingerprint variable are missing. Secret values are never printed."
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "All required Android production signing configuration names are present."
      - name: Install Expo dependencies
        working-directory: apps/mobile
        run: npm install --include=optional --no-audit --no-fund --package-lock=false
      - name: Set monotonic Android app version
        working-directory: apps/mobile
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          node -e "const fs=require('node:fs');const p='app.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.expo.android.versionCode=Number(process.env.BUILD_NUMBER);j.expo.version='1.0.'+process.env.BUILD_NUMBER;fs.writeFileSync(p,JSON.stringify(j,null,2));"
      - name: Generate Android project
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: "1"
        run: npx expo prebuild --platform android --clean --no-install
      - name: Assemble release APK
        working-directory: apps/mobile/android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          for attempt in 1 2 3; do
            echo "Gradle production build attempt $attempt/3"
            if ./gradlew --no-daemon --stacktrace --refresh-dependencies :app:assembleRelease; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Android production build failed after three logged attempts."
              exit 1
            fi
            sleep "$((attempt * 10))"
          done
      - name: Parse production APK manifest and align pre-sign APK
        shell: bash
        run: |
          set -euo pipefail
          SDK_BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          APK="$(find apps/mobile/android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          mkdir -p release
          BUILD_NUMBER="$GITHUB_RUN_NUMBER"
          "$SDK_BUILD_TOOLS/aapt" dump badging "$APK" > release/APK-METADATA.txt
          node scripts/verify-android-apk-metadata.mjs release/APK-METADATA.txt "$BUILD_NUMBER" "1.0.$BUILD_NUMBER"
          "$SDK_BUILD_TOOLS/aapt" dump xmltree "$APK" AndroidManifest.xml > release/APK-MERGED-MANIFEST-XMLTREE.txt
          (cd release && sha256sum APK-METADATA.txt > APK-METADATA-SHA256.txt)
          (cd release && sha256sum APK-MERGED-MANIFEST-XMLTREE.txt > APK-MERGED-MANIFEST-SHA256.txt)
          "$SDK_BUILD_TOOLS/zipalign" -p -f 4 "$APK" "$RUNNER_TEMP/CodeForge-aligned.apk"
      - name: Verify Android permission allowlist
        run: node scripts/verify-android-permissions.mjs release/APK-METADATA.txt
      - name: Sign APK with durable production keystore
        id: android-signing-run
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/codeforge-production-release.jks"
          trap 'rm -f "$KEYSTORE"' EXIT
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64-encoded keystore data."
            exit 1
          fi
          if [[ ! -s "$KEYSTORE" ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 decoded to an empty file."
            exit 1
          fi
          KEYSTORE_BYTES="$(wc -c < "$KEYSTORE" | tr -d '[:space:]')"
          echo "Decoded Android keystore size: $KEYSTORE_BYTES bytes"
          KEYSTORE_LIST="$RUNNER_TEMP/codeforge-keystore-list.txt"
          KEYSTORE_DIAGNOSTIC="$RUNNER_TEMP/codeforge-keytool-diagnostic.txt"
          KEYSTORE_MAGIC="$(od -An -tx1 -N4 "$KEYSTORE" | tr -d '[:space:]')"
          case "$KEYSTORE_MAGIC" in
            feedfeed) KEYSTORE_TYPE="JKS" ;;
            30*) KEYSTORE_TYPE="PKCS12" ;;
            *) KEYSTORE_TYPE="unknown" ;;
          esac
          echo "Decoded Android keystore container: $KEYSTORE_TYPE (magic=$KEYSTORE_MAGIC, bytes=$KEYSTORE_BYTES)"
          STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
          KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
          if [[ "$KEYSTORE_TYPE" == "unknown" ]]; then
            for candidate_type in JKS PKCS12; do
              if keytool -list -storetype "$candidate_type" -keystore "$KEYSTORE" -storepass "$ANDROID_KEYSTORE_PASSWORD" > "$KEYSTORE_DIAGNOSTIC" 2>&1; then
                KEYSTORE_TYPE="$candidate_type"
                break
              elif keytool -list -storetype "$candidate_type" -keystore "$KEYSTORE" -storepass "$ANDROID_KEY_PASSWORD" > "$KEYSTORE_DIAGNOSTIC" 2>&1; then
                KEYSTORE_TYPE="$candidate_type"
                STORE_PASSWORD="$ANDROID_KEY_PASSWORD"
                KEY_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
                echo "::warning::The keystore opened only when the two Android password secrets were swapped. Using the validated mapping without printing either value."
                break
              fi
            done
          elif ! keytool -list -storetype "$KEYSTORE_TYPE" -keystore "$KEYSTORE" -storepass "$ANDROID_KEYSTORE_PASSWORD" > "$KEYSTORE_DIAGNOSTIC" 2>&1; then
            if keytool -list -storetype "$KEYSTORE_TYPE" -keystore "$KEYSTORE" -storepass "$ANDROID_KEY_PASSWORD" > "$KEYSTORE_DIAGNOSTIC" 2>&1; then
              STORE_PASSWORD="$ANDROID_KEY_PASSWORD"
              KEY_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
              echo "::warning::The keystore opened only when the two Android password secrets were swapped. Using the validated mapping without printing either value."
            else
              KEYSTORE_TYPE="invalid"
            fi
          fi
          export CODEFORGE_STORE_PASSWORD="$STORE_PASSWORD"
          export CODEFORGE_KEY_PASSWORD="$KEY_PASSWORD"
          if [[ "$KEYSTORE_TYPE" == "unknown" || "$KEYSTORE_TYPE" == "invalid" ]]; then
            KEYTOOL_DIAGNOSTIC="$(python3 - "$KEYSTORE_DIAGNOSTIC" <<'PY'
          import os
          import pathlib
          import sys
          diagnostic = pathlib.Path(sys.argv[1]).read_text(errors="replace")
          for name in ("ANDROID_KEYSTORE_BASE64", "ANDROID_KEYSTORE_PASSWORD", "ANDROID_KEY_PASSWORD", "ANDROID_KEY_ALIAS"):
              secret = os.environ.get(name, "")
              if secret:
                  diagnostic = diagnostic.replace(secret, "[REDACTED]")
          lines = [line.strip() for line in diagnostic.splitlines() if line.strip()]
          print(" | ".join(lines[:2])[:240] or "no diagnostic returned")
          PY
          )"
            echo "::error::The decoded Android keystore could not be opened. Container magic=$KEYSTORE_MAGIC; size=$KEYSTORE_BYTES bytes; detected type=$KEYSTORE_TYPE. Verify the original keystore bytes and matching store password. Safe keytool diagnostic: $KEYTOOL_DIAGNOSTIC"
            exit 1
          fi
          cp "$KEYSTORE_DIAGNOSTIC" "$KEYSTORE_LIST"
          echo "Android keystore opened successfully as $KEYSTORE_TYPE."
          if ! awk -F, -v alias="$ANDROID_KEY_ALIAS" '$1 == alias { found=1 } END { exit !found }' "$KEYSTORE_LIST"; then
            echo "::error::The Android keystore opened, but ANDROID_KEY_ALIAS was not found in it. Verify the alias configured in repository secrets."
            exit 1
          fi
          echo "Configured Android key alias is present."
          EXPECTED_CERT="$(printf '%s' "$ANDROID_SIGNING_CERT_SHA256" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          ACTUAL_KEYSTORE_CERT="$(keytool -exportcert -storetype "$KEYSTORE_TYPE" -keystore "$KEYSTORE" -alias "$ANDROID_KEY_ALIAS" -storepass "$STORE_PASSWORD" 2>/dev/null | sha256sum | awk '{print toupper($1)}')"
          echo "Android keystore certificate SHA-256: $ACTUAL_KEYSTORE_CERT"
          if [[ ! "$EXPECTED_CERT" =~ ^[A-F0-9]{64}$ ]]; then
            echo "::error::ANDROID_SIGNING_CERT_SHA256 must contain exactly 64 hexadecimal characters."
            exit 1
          fi
          if [[ "$ACTUAL_KEYSTORE_CERT" != "$EXPECTED_CERT" ]]; then
            echo "::error::ANDROID_SIGNING_CERT_SHA256 does not match the certificate inside ANDROID_KEYSTORE_BASE64. Update the repository variable only after confirming this is the intended production signing key."
            exit 1
          fi
          SDK_BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          if ! "$SDK_BUILD_TOOLS/apksigner" sign --verbose \
            --ks "$KEYSTORE" \
            --ks-type "$KEYSTORE_TYPE" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:CODEFORGE_STORE_PASSWORD \
            --key-pass env:CODEFORGE_KEY_PASSWORD \
            --out release/CodeForge.apk "$RUNNER_TEMP/CodeForge-aligned.apk"; then
            echo "::warning::ANDROID_KEY_PASSWORD did not unlock the signing key; retrying with the keystore password for single-password keystore formats."
            rm -f release/CodeForge.apk
            "$SDK_BUILD_TOOLS/apksigner" sign --verbose \
              --ks "$KEYSTORE" \
              --ks-type "$KEYSTORE_TYPE" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass env:CODEFORGE_STORE_PASSWORD \
              --key-pass env:CODEFORGE_STORE_PASSWORD \
              --out release/CodeForge.apk "$RUNNER_TEMP/CodeForge-aligned.apk"
          fi
          if ! "$SDK_BUILD_TOOLS/apksigner" verify --verbose --Werr --print-certs release/CodeForge.apk | tee release/ANDROID-SIGNING-VERIFICATION.txt; then
            echo "::error::Android APK signature verification failed."
            exit 1
          fi
          "$SDK_BUILD_TOOLS/zipalign" -c 4 release/CodeForge.apk
          "$SDK_BUILD_TOOLS/aapt" dump badging release/CodeForge.apk > release/APK-METADATA-FINAL.txt
          node scripts/verify-android-apk-metadata.mjs release/APK-METADATA-FINAL.txt "$GITHUB_RUN_NUMBER" "1.0.$GITHUB_RUN_NUMBER"
          node scripts/verify-android-permissions.mjs release/APK-METADATA-FINAL.txt
          cmp release/APK-METADATA.txt release/APK-METADATA-FINAL.txt
          "$SDK_BUILD_TOOLS/aapt" dump xmltree release/CodeForge.apk AndroidManifest.xml > release/APK-MERGED-MANIFEST-XMLTREE-FINAL.txt
          cmp release/APK-MERGED-MANIFEST-XMLTREE.txt release/APK-MERGED-MANIFEST-XMLTREE-FINAL.txt
          ACTUAL_SIGNER_CERT="$(node scripts/extract-apksigner-cert.mjs release/ANDROID-SIGNING-VERIFICATION.txt)"
          if [[ -z "$ACTUAL_SIGNER_CERT" || "$ACTUAL_SIGNER_CERT" != "$EXPECTED_CERT" ]]; then
            echo "::error::The signed APK certificate does not match the configured production fingerprint."
            exit 1
          fi
          printf 'SIGNING=durable\nCERT_SHA256=%s\nKEY_ALIAS=%s\nKEYSTORE_TYPE=%s\n' "$ACTUAL_SIGNER_CERT" "$ANDROID_KEY_ALIAS" "$KEYSTORE_TYPE" > release/ANDROID-SIGNING-METADATA.txt
          rm -f "$KEYSTORE"
      - name: Stage non-production Android diagnostic when durable signing fails
        id: android-signing-diagnostic
        if: always() && steps.android-signing-run.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          DIAGNOSTIC_DIR="$RUNNER_TEMP/codeforge-android-non-production-diagnostic"
          if [[ ! -s "$RUNNER_TEMP/CodeForge-aligned.apk" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$DIAGNOSTIC_DIR"
          cp "$RUNNER_TEMP/CodeForge-aligned.apk" "$DIAGNOSTIC_DIR/NOT-PRODUCTION-ELIGIBLE-CodeForge.apk"
          {
            printf 'SOURCE_SHA=%s\n' "$GITHUB_SHA"
            printf 'WORKFLOW_RUN_ID=%s\n' "$GITHUB_RUN_ID"
            printf 'SIGNING_STATUS=not-production-verified\n'
            printf 'INSTALLABLE_FOR_PRODUCTION=false\n'
            printf 'REASON=durable_android_signing_or_identity_validation_failed\n'
          } > "$DIAGNOSTIC_DIR/DIAGNOSTIC-METADATA.txt"
          sha256sum "$DIAGNOSTIC_DIR/NOT-PRODUCTION-ELIGIBLE-CodeForge.apk" > "$DIAGNOSTIC_DIR/SHA256-DIAGNOSTIC.txt"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Upload non-production Android diagnostic artifact
        if: always() && steps.android-signing-diagnostic.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NOT-PRODUCTION-ELIGIBLE-DIAGNOSTIC-Android-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/codeforge-android-non-production-diagnostic/*
          if-no-files-found: error
          retention-days: 1
      - name: Record Android build metadata and checksum
        shell: bash
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          (cd release && sha256sum CodeForge.apk > SHA256-Android.txt)
          SIGNING="$(sed -n 's/^SIGNING=//p' release/ANDROID-SIGNING-METADATA.txt | head -n 1)"
          CERT_SHA256="$(sed -n 's/^CERT_SHA256=//p' release/ANDROID-SIGNING-METADATA.txt | head -n 1)"
          APK_SHA256="$(sha256sum release/CodeForge.apk | awk '{print $1}')"
          APK_METADATA_SHA256="$(sha256sum release/APK-METADATA-FINAL.txt | awk '{print $1}')"
          APK_MANIFEST_SHA256="$(sha256sum release/APK-MERGED-MANIFEST-XMLTREE-FINAL.txt | awk '{print $1}')"
          if [[ "$SIGNING" != "durable" || ! "$CERT_SHA256" =~ ^[A-F0-9]{64}$ ]]; then
            echo "::error::A durably signed APK with a verified certificate fingerprint is required; unsigned production APKs are not staged."
            exit 1
          fi
          {
            printf 'PACKAGE=com.codeforge.ide\n'
            printf 'VERSION=1.0.%s\n' "$BUILD_NUMBER"
            printf 'VERSION_CODE=%s\n' "$BUILD_NUMBER"
            printf 'COMMIT=%s\n' "$GITHUB_SHA"
            printf 'WORKFLOW_RUN_ID=%s\n' "$GITHUB_RUN_ID"
            printf 'RUN_NUMBER=%s\n' "$BUILD_NUMBER"
            printf 'SIGNING=%s\n' "$SIGNING"
            printf 'CERT_SHA256=%s\n' "$CERT_SHA256"
            printf 'APK_SHA256=%s\n' "$APK_SHA256"
            printf 'APK_METADATA_SHA256=%s\n' "$APK_METADATA_SHA256"
            printf 'APK_MANIFEST_SHA256=%s\n' "$APK_MANIFEST_SHA256"
          } > release/BUILD-METADATA.txt
          rm -f "$RUNNER_TEMP/CodeForge-aligned.apk"
      - name: Enable KVM for production APK emulator verification
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
      - name: Install and launch production-signed APK in disposable emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-linux-hw-accel: false
          disable-animations: true
          script: bash scripts/android-install-smoke.sh release/CodeForge.apk
      - uses: actions/upload-artifact@v4
        with:
          name: codeforge-android-apk
          path: release/*
          if-no-files-found: error
          retention-days: 30
